                        <span class="segment-desc">品質 85% / 200 DPI (降約 30%)</span>
                    </button>
                    <button type="button" class="segment-btn active" data-mode="medium">
                        <span>推薦壓縮</span>
                        <span class="segment-desc">品質 65% / 144 DPI (降約 60%)</span>
                    </button>
                    <button type="button" class="segment-btn" data-mode="high">
                        <span>極致壓縮</span>
                        <span class="segment-desc">品質 45% / 96 DPI (降約 80%)</span>
                    </button>
                </div>

                <!-- 高級設定摺疊 Accordion -->
                <div class="accordion-header" id="accordionToggle">
                    <span><i class="fa-solid fa-gear"></i> 自訂高級設定 (Quality & Resolution)</span>
                    <i class="fa-solid fa-chevron-down" id="accordionIcon"></i>
                </div>
                <div class="accordion-content" id="accordionContent">
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>JPEG 壓縮品質 (Quality)</span>
                            <span class="slider-value" id="qualityValDisplay">65%</span>
                        </div>
                        <input type="range" id="qualitySlider" class="custom-range" min="10" max="90" value="65" step="5">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span>解析度上限 (Max DPI / Scaling)</span>
                            <span class="slider-value" id="dpiValDisplay">144 DPI</span>
                        </div>
                        <input type="range" id="dpiSlider" class="custom-range" min="72" max="300" value="144" step="24">
                    </div>
                </div>
            </section>

            <!-- 按鈕組 -->
            <div class="btn-group">
                <button class="action-btn" id="startCompressBtn" disabled>
                    <i class="fa-solid fa-compress"></i> 開始圖片深度壓縮
                </button>
                <button class="batch-zip-btn" id="batchZipBtn">
                    <i class="fa-solid fa-file-zipper"></i> 打包下載所有壓縮 PDF (ZIP)
                </button>
            </div>
        </main>
    </div>

    <!-- 頁面邏輯 Script -->
    <script>
        // ----------------------------------------------------
        // 1. 全域變數與 DOM 元素存取
        // ----------------------------------------------------
        let fileQueue = []; // { id, file, name, size, buffer, status, inspectData, resultData }
        let worker = null;
        let isCompressing = false;

        let config = {
            quality: 0.65,
            scale: 0.65,
            maxDpi: 144
        };

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const queueContainer = document.getElementById('queueContainer');
        const startCompressBtn = document.getElementById('startCompressBtn');
        const batchZipBtn = document.getElementById('batchZipBtn');

        const toastInfo = document.getElementById('toastInfo');
        const toastText = document.getElementById('toastText');

        const segmentBtns = document.querySelectorAll('.segment-btn');
        const accordionToggle = document.getElementById('accordionToggle');
        const accordionContent = document.getElementById('accordionContent');
        const accordionIcon = document.getElementById('accordionIcon');

        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValDisplay = document.getElementById('qualityValDisplay');
        const dpiSlider = document.getElementById('dpiSlider');
        const dpiValDisplay = document.getElementById('dpiValDisplay');

        // ----------------------------------------------------
        // 2. 初始化與網址參數雙向連動 (URL Parameter State Syncing)
        // ----------------------------------------------------
        function initFromURL() {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode');
            const qParam = parseInt(params.get('quality'), 10);
            const dpiParam = parseInt(params.get('dpi'), 10);

            if (mode && ['low', 'medium', 'high'].includes(mode)) {
                applyModePreset(mode);
            } else if (!isNaN(qParam) || !isNaN(dpiParam)) {
                if (!isNaN(qParam) && qParam >= 10 && qParam <= 90) {
                    config.quality = qParam / 100;
                    qualitySlider.value = qParam;
                    qualityValDisplay.textContent = `${qParam}%`;
                }
                if (!isNaN(dpiParam) && dpiParam >= 72 && dpiParam <= 300) {
                    config.maxDpi = dpiParam;
                    dpiSlider.value = dpiParam;
                    dpiValDisplay.textContent = `${dpiParam} DPI`;
                }
                segmentBtns.forEach(b => b.classList.remove('active'));
            }
        }

        function syncToURL() {
            const params = new URLSearchParams();
            const activeSeg = document.querySelector('.segment-btn.active');
            if (activeSeg) {
                params.set('mode', activeSeg.dataset.mode);
            } else {
                params.set('quality', Math.round(config.quality * 100));
                params.set('dpi', config.maxDpi);
            }
            const newUrl = params.toString() ? '?' + params.toString() : window.location.pathname;
            history.replaceState(null, '', newUrl);
        }

        function applyModePreset(mode) {
            segmentBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
            if (mode === 'low') {
                config.quality = 0.85;
                config.maxDpi = 200;
                config.scale = 0.8;
            } else if (mode === 'medium') {
                config.quality = 0.65;
                config.maxDpi = 144;
                config.scale = 0.65;
            } else if (mode === 'high') {
                config.quality = 0.45;
                config.maxDpi = 96;
                config.scale = 0.5;
            }
            qualitySlider.value = Math.round(config.quality * 100);
            qualityValDisplay.textContent = `${qualitySlider.value}%`;
            dpiSlider.value = config.maxDpi;
            dpiValDisplay.textContent = `${config.maxDpi} DPI`;
            syncToURL();
            renderQueueList();
        }

        // ----------------------------------------------------
        // 3. Web Worker 訊息處置
        // ----------------------------------------------------
        function initWorker() {
            if (worker) worker.terminate();
            worker = new Worker('pdf-worker.js');

            worker.onmessage = function(e) {
                const data = e.data;
                const item = fileQueue.find(f => f.id === data.fileId);

                if (data.type === 'inspect_result') {
                    if (item) {
                        item.inspectData = data;
                        item.status = 'ready';
                        renderQueueList();
                        updateActionButtons();
                    }
                } else if (data.type === 'progress') {
                    if (item) {
                        updateItemProgressUI(item.id, data.message, data.current, data.totalImages);
                    }
                } else if (data.type === 'complete') {
                    if (item) {
                        item.status = 'done';
                        item.resultData = data;
                        updateItemResultUI(item.id, data);
                        checkBatchCompletion();
                    }
                } else if (data.type === 'error') {
                    if (item) {
                        item.status = 'error';
                        updateItemErrorUI(item.id, data.message);
                        checkBatchCompletion();
                    }
                }
            };

            worker.onerror = function(err) {
                showToast(`Worker 執行遭遇錯誤: ${err.message}`);
                isCompressing = false;
                updateActionButtons();
            };
        }

        // ----------------------------------------------------
        // 4. 事件綁定
        // ----------------------------------------------------
        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFilesSelect(Array.from(e.dataTransfer.files));
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFilesSelect(Array.from(e.target.files));
            }
        });

        segmentBtns.forEach(btn => {
            btn.addEventListener('click', () => applyModePreset(btn.dataset.mode));
        });

        accordionToggle.addEventListener('click', () => {
            accordionContent.classList.toggle('open');
            accordionIcon.style.transform = accordionContent.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        qualitySlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            config.quality = val / 100;
            qualityValDisplay.textContent = `${val}%`;
            segmentBtns.forEach(b => b.classList.remove('active'));
            syncToURL();
            renderQueueList();
        });

        dpiSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            config.maxDpi = val;
            dpiValDisplay.textContent = `${val} DPI`;
            // 連動更新 scale
            config.scale = val <= 96 ? 0.5 : (val <= 144 ? 0.65 : (val <= 200 ? 0.8 : 1.0));
            segmentBtns.forEach(b => b.classList.remove('active'));
            syncToURL();
            renderQueueList();
        });

        startCompressBtn.addEventListener('click', startBatchCompression);
        batchZipBtn.addEventListener('click', downloadAllAsZip);

        // ----------------------------------------------------
        // 5. 檔案選擇、預檢與佇列 UI 渲染
        // ----------------------------------------------------
        function handleFilesSelect(files) {
            const pdfFiles = files.filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));

            if (pdfFiles.length === 0) {
                showToast('請選擇正確的 PDF 格式檔案 (.pdf)');
                return;
            }

            hideToast();

            pdfFiles.forEach(file => {
                const id = 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                const queueItem = {
                    id,
                    file,
                    name: file.name,
                    size: file.size,
                    buffer: null,
                    status: 'inspecting',
                    inspectData: null,
                    resultData: null
                };

                fileQueue.push(queueItem);

                const reader = new FileReader();
                reader.onload = function(e) {
                    queueItem.buffer = e.target.result;
                    // 即時發起 Worker 預檢
                    if (worker) {
                        worker.postMessage({
                            type: 'inspect',
                            fileId: queueItem.id,
                            pdfBuffer: queueItem.buffer.slice(0)
                        });
                    }
                };
                reader.readAsArrayBuffer(file);
            });

            renderQueueList();
            updateActionButtons();
            fileInput.value = '';
        }

        function removeQueueItem(id) {
            fileQueue = fileQueue.filter(f => f.id !== id);
            renderQueueList();
            updateActionButtons();
        }

        function getDynamicEstRatio(item) {
            if (!item.inspectData || !item.inspectData.images) return 0;
            const { images, originalSize } = item.inspectData;
            if (!images || images.length === 0 || originalSize <= 0) return 0;

            let totalSaved = 0;
            let maxDim = 4000;
            if (config.maxDpi <= 96) maxDim = 960;
            else if (config.maxDpi <= 144) maxDim = 1440;
            else if (config.maxDpi <= 200) maxDim = 2000;
            else if (config.maxDpi <= 300) maxDim = 3000;

            images.forEach(img => {
                if (img.status === 'compressible') {
                    const origW = img.width || 1000;
                    const origH = img.height || 1000;
                    const origBytes = img.byteLen || (origW * origH * 0.35);

                    let targetW = origW * config.scale;
                    let targetH = origH * config.scale;
                    const currentMax = Math.max(targetW, targetH);
                    if (currentMax > maxDim) {
                        const factor = maxDim / currentMax;
                        targetW *= factor;
                        targetH *= factor;
                    }

                    const areaRatio = (targetW * targetH) / (origW * origH);
                    const compressionFactor = Math.min(0.85, config.quality * 0.7);
                    const estNewBytes = origBytes * areaRatio * compressionFactor;

                    if (estNewBytes < origBytes) {
                        totalSaved += (origBytes - estNewBytes);
                    }
                }
            });

            if (totalSaved <= 0) return 0;
            return Math.min(92, Math.max(5, Math.round((totalSaved / originalSize) * 100)));
        }

        function renderQueueList() {
            if (fileQueue.length === 0) {
                queueContainer.innerHTML = '';
                return;
            }

            let html = '';
            fileQueue.forEach(item => {
                let badgeText = '正在掃描結構...';
                let estText = '';
                if (item.status === 'ready' && item.inspectData) {
                    const d = item.inspectData;
                    if (d.totalImages === 0) {
                        badgeText = '無內嵌圖片 (純文字 PDF)';
                    } else {
                        badgeText = `含 ${d.totalImages} 張圖片 (${d.compressibleCount} 張可降採樣)`;
                        const estRatio = getDynamicEstRatio(item) || d.estRatio;
                        if (estRatio > 0) estText = `預估瘦身 ~${estRatio}%`;
                    }
                } else if (item.status === 'done') {
                    badgeText = '壓縮重構完成';
                }

                html += `
                <div class="queue-item-card" id="card_${item.id}">
                    <div class="queue-item-header">
                        <div class="file-info">
                            <div class="file-icon-box"><i class="fa-solid fa-file-pdf"></i></div>
                            <div class="file-meta">
                                <div class="file-name">${escapeHtml(item.name)}</div>
                                <div class="file-badges">
                                    <span class="file-size-badge">${formatBytes(item.size)}</span>
                                    <span class="inspect-badge">${badgeText}</span>
                                    ${estText ? `<span class="inspect-badge est">${estText}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="item-actions">
                            ${item.inspectData && item.inspectData.images && item.inspectData.images.length > 0 ? `
                                <button type="button" class="toggle-details-btn" onclick="toggleDetails('${item.id}')">
                                    <i class="fa-solid fa-circle-info"></i> 明細 <i class="fa-solid fa-chevron-down"></i>
                                </button>
                            ` : ''}
                            <button type="button" class="remove-item-btn" onclick="removeQueueItem('${item.id}')" title="移除檔案">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 進度條 -->
                    <div class="item-progress-bar-container" id="prog_box_${item.id}">
                        <div class="item-progress-bar-fill" id="prog_fill_${item.id}"></div>
                    </div>

                    <!-- 結果明細列 -->
                    <div class="item-result-badge" id="res_badge_${item.id}"></div>

                    <!-- 明細圖片表格 Drawer -->
                    ${item.inspectData && item.inspectData.images ? renderDetailsDrawer(item) : ''}
                </div>`;
            });

            queueContainer.innerHTML = html;
        }

        function renderDetailsDrawer(item) {
            const images = item.inspectData.images;
            let rows = '';
            images.forEach((img, idx) => {
                let statusClass = img.status === 'compressible' ? 'compressible' : 'protected';
                rows += `
                <tr>
                    <td>#${idx + 1}</td>
                    <td>${img.width} × ${img.height}</td>
                    <td>${img.filter || 'Raw'} (${img.colorSpace})</td>
                    <td><span class="status-pill ${statusClass}">${img.statusReason}</span></td>
                </tr>`;
            });

            return `
            <div class="image-details-drawer" id="drawer_${item.id}">
                <table class="details-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>維度 (WxH)</th>
                            <th>格式/色彩</th>
                            <th>預檢決策</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }

        function toggleDetails(id) {
            const drawer = document.getElementById(`drawer_${id}`);
            if (drawer) drawer.classList.toggle('open');
        }

        // ----------------------------------------------------
        // 6. 批次壓縮處理邏輯
        // ----------------------------------------------------
        function startBatchCompression() {
            if (fileQueue.length === 0 || isCompressing) return;

            isCompressing = true;
            updateActionButtons();
            hideToast();

            // 依序處理佇列中未完成的檔案
            processNextQueueItem();
        }

        function processNextQueueItem() {
            const target = fileQueue.find(f => f.status === 'ready' || f.status === 'inspecting');
            if (!target) {
                isCompressing = false;
                updateActionButtons();
                return;
            }

            target.status = 'compressing';
            const progBox = document.getElementById(`prog_box_${target.id}`);
            if (progBox) progBox.style.display = 'block';

            worker.postMessage({
                type: 'compress',
                fileId: target.id,
                pdfBuffer: target.buffer.slice(0),
                config: config
            });
        }

        function updateItemProgressUI(fileId, msg, current, total) {
            const fill = document.getElementById(`prog_fill_${fileId}`);
            if (fill) {
                const pct = total ? Math.round((current / total) * 90) : 30;
                fill.style.width = `${Math.max(10, pct)}%`;
            }
        }

        function updateItemResultUI(fileId, data) {
            const item = fileQueue.find(f => f.id === fileId);
            const fill = document.getElementById(`prog_fill_${fileId}`);
            const resBadge = document.getElementById(`res_badge_${fileId}`);

            if (fill) fill.style.width = '100%';

            if (resBadge && item) {
                const savedBytes = data.originalSize - data.compressedSize;
                let ratio = 0;
                if (data.originalSize > 0) ratio = Math.max(0, ((savedBytes / data.originalSize) * 100)).toFixed(1);

                const blob = new Blob([data.pdfBuffer], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                item.blobUrl = blobUrl;

                const nameWithoutExt = item.name.replace(/\.pdf$/i, '');
                const downloadName = `${nameWithoutExt}_compressed.pdf`;

                resBadge.innerHTML = `
                    <div>
                        <strong>原檔: ${formatBytes(data.originalSize)}</strong> ➔
                        <strong style="color: var(--accent-green)">壓縮檔: ${formatBytes(data.compressedSize)}</strong>
                        (減小 ${ratio}%)
                    </div>
                    <a href="${blobUrl}" download="${downloadName}" class="single-download-link">
                        <i class="fa-solid fa-download"></i> 下載 PDF
                    </a>`;
                resBadge.style.display = 'flex';
            }
        }

        function updateItemErrorUI(fileId, msg) {
            const resBadge = document.getElementById(`res_badge_${fileId}`);
            if (resBadge) {
                resBadge.innerHTML = `<span style="color: #ff4757"><i class="fa-solid fa-triangle-exclamation"></i> 處理失敗: ${escapeHtml(msg)}</span>`;
                resBadge.style.display = 'flex';
            }
        }

        function checkBatchCompletion() {
            // 自動推進下一個檔案
            processNextQueueItem();
        }

        // ----------------------------------------------------
        // 7. 多檔 ZIP 打包下載
        // ----------------------------------------------------
        async function downloadAllAsZip() {
            const completedItems = fileQueue.filter(f => f.status === 'done' && f.resultData && f.resultData.pdfBuffer);
            if (completedItems.length === 0) return;

            const zip = new JSZip();
            completedItems.forEach(item => {
                const nameWithoutExt = item.name.replace(/\.pdf$/i, '');
                zip.file(`${nameWithoutExt}_compressed.pdf`, item.resultData.pdfBuffer);
            });

            showToast('正在打包 ZIP 壓縮檔，請稍候...');
            const content = await zip.generateAsync({ type: 'blob' });
            const zipUrl = URL.createObjectURL(content);

            const a = document.createElement('a');
            a.href = zipUrl;
            a.download = `PDF_Compressed_Batch_${new Date().toISOString().slice(0, 10)}.zip`;
            a.click();
            URL.revokeObjectURL(zipUrl);
            hideToast();
        }

        function updateActionButtons() {
            const hasFiles = fileQueue.length > 0;
            const hasCompleted = fileQueue.some(f => f.status === 'done');

            startCompressBtn.disabled = !hasFiles || isCompressing;
            batchZipBtn.style.display = (hasCompleted && fileQueue.length > 1) ? 'flex' : 'none';
        }

        // ----------------------------------------------------
        // 8. 輔助函數
        // ----------------------------------------------------
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showToast(text) {
            toastText.textContent = text;
            toastInfo.style.display = 'flex';
        }

        function hideToast() {
            toastInfo.style.display = 'none';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // 初始化頁面與 Worker
        initFromURL();
        initWorker();
    </script>
    <script src="../js/common-particles.js" defer></script>
</body>
</html>
