    <style>
        :root {
            --theme-color: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.6); /* 霓虹紅主題 */
            --accent-glow-rgb: 255, 0, 85;
        }

        /* 回首頁按鈕 */
        .back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            z-index: 11;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 0, 85, 0.1);
            color: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .back-btn:hover svg {
            transform: translateX(-3px);
        }

        h1 {
            font-weight: 300;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-align: center;
            text-transform: uppercase;
        }

        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            box-shadow: 0 0 8px var(--accent-glow);
            margin: 0.8rem auto 0;
            animation: glow-pulse 3s infinite ease-in-out;
        }

        .subtitle-top {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 3rem;
            text-align: center;
            text-transform: uppercase;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 1px var(--accent-glow)); }
            50% { opacity: 1; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        }

        /* 雙欄版面 */
        .calculator-grid {
            display: grid;
            grid-template-columns: 1.1fr 1.9fr;
            gap: 2.5rem;
            align-items: start;
        }

        /* ====== 左側表單樣式 ====== */
        .form-section {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .input-group label span.badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 0, 85, 0.12);
            color: #ff0055;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 6px;
            border: 1px solid rgba(255, 0, 85, 0.2);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            padding-right: 4.5rem;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: rgba(255, 0, 85, 0.6);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }

        /* 條件式欄位容器 */
        .conditional-group {
            margin-bottom: 1.5rem;
            border-left: 2px solid rgba(255, 0, 85, 0.3);
            padding-left: 1rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 單位選擇器 */
        .unit-selector {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .unit-selector .unit-btn,
        .toggle-buttons-container .unit-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .unit-selector .unit-btn.active,
        .toggle-buttons-container .unit-btn.active {
            background: rgba(255, 0, 85, 0.15);
            color: #ff0055;
        }

        /* 獨立切換按鈕組樣式 */
        .toggle-buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            width: 100%;
        }

        .toggle-buttons-container .unit-btn {
            padding: 0.6rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: center;
            transition: all 0.3s ease;
            height: auto;
            display: block;
        }

        .toggle-buttons-container .unit-btn.active {
            background: rgba(255, 0, 85, 0.12);
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.1);
        }

        /* ====== 右側結果樣式 ====== */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            min-width: 0;
        }

        .results-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 指標看板 */
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
        }

        .indicator-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.2rem 1rem;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.005);
            transition: all 0.3s ease;
            position: relative;
        }

        .indicator-card:hover {
            border-color: rgba(255, 0, 85, 0.2);
            background: rgba(255, 255, 255, 0.015);
        }

        .indicator-card h4 {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
        }

        .indicator-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .indicator-card.total-value .value {
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .indicator-card .caption {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
            line-height: 1.3;
        }

        /* 圖表區塊 */
        .chart-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            width: 100%;
            height: 320px;
        }

        /* 明細表格區塊 */
        .table-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            max-width: 100%;
        }

        .table-container h3 {
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.85rem;
        }

        table th {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
        }

        table td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: 'JetBrains Mono', monospace;
            color: rgba(255, 255, 255, 0.8);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
        }

        /* 平板及手機等小螢幕表格優化 */
        @media (max-width: 768px) {
            .table-container {
                padding: 1rem;
            }

            table {
                min-width: 650px;
            }

            table th:first-child,
            table td:first-child {
                position: sticky;
                left: 0;
                background-color: #0b0b0e;
                z-index: 2;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.4);
            }

            table tr:hover td:first-child {
                background-color: #1a1a24;
            }
        }

        /* 自訂滾動條 */
        .table-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .table-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 85, 0.2);
            border-radius: 3px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 0, 85, 0.4);
        }

        /* 響應式佈局 */
        @media (max-width: 900px) {
            .back-btn {
                position: static;
                display: inline-flex;
                margin-bottom: 1.5rem;
            }
            .calculator-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .glass-container {
                padding: 2.5rem 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .indicators-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .chart-container {
                height: 250px;
            }
        }

        /* 隱藏原生上下箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* ====== 分享連結按鈕 (霧虹紅主題) ====== */
        .share-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -0.5rem;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(255, 0, 85, 0.06);
            border: 1px solid rgba(255, 0, 85, 0.25);
            color: rgba(255, 0, 85, 0.75);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .share-btn:hover {
            background: rgba(255, 0, 85, 0.12);
            border-color: rgba(255, 0, 85, 0.6);
            color: #ff0055;
            box-shadow: 0 0 16px rgba(255, 0, 85, 0.15);
        }
        .share-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .share-btn:hover svg { transform: rotate(-8deg) scale(1.15); }
        .share-btn.copied {
            background: rgba(76, 217, 100, 0.1);
            border-color: rgba(76, 217, 100, 0.5);
            color: #4cd964;
            box-shadow: 0 0 14px rgba(76, 217, 100, 0.15);
        }
        .share-btn .btn-text { transition: all 0.2s ease; }
            .page-description {
            max-width: 800px;
            margin: 1.2rem auto 0 auto;
            font-size: 0.92rem;
            font-weight: 300;
            line-height: 1.6;
            color: var(--text-secondary, #8892b0);
            text-align: center;
        }

    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="glass-container">
        <!-- 回首頁 -->
        <a href="../index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59-1.42-1.42L4 12l8 8 1.42-1.42L7.83 13H20v-2z"/></svg>
            工具庫首頁
        </a>

        <h1>線上汽車貸款試算器</h1>
        <div class="subtitle-top">Car Loan Calculator</div>
        <p class="page-description">專業免費的線上車貸計算機，支援自備款成數連動、寬限期、階梯低月付與氣球貸尾款試算，提供 APR 實質年利率與完整還款明細圖表。</p>

        <div class="calculator-grid">
            <!-- 左側表單 -->
            <div class="form-section">
                <!-- 貸款方案選擇 -->
                <div class="input-group">
                    <label>貸款方案</label>
                    <div class="toggle-buttons-container" id="loan-scheme-selector" style="grid-template-columns: repeat(2, 1fr); gap: 0.4rem; margin-bottom: 0.5rem;">
                        <button class="unit-btn active" data-unit="standard">一般方案</button>
                        <button class="unit-btn" data-unit="grace">寬限期方案</button>
                        <button class="unit-btn" data-unit="stepped">階梯式方案</button>
                        <button class="unit-btn" data-unit="balloon">尾款保留案</button>
                    </div>
                </div>

                <!-- 方案說明與警語區 -->
                <div id="scheme-description" style="font-size: 0.78rem; line-height: 1.5; color: var(--text-secondary); background: rgba(255, 0, 85, 0.03); border: 1px solid rgba(255, 0, 85, 0.1); border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 1.5rem; transition: all 0.3s ease;">
                    <!-- JS 動態寫入內容 -->
                </div>

                <!-- 車款總價 -->
                <div class="input-group">
                    <label for="input-car-price">車款總價</label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-car-price" value="1,200,000" placeholder="例如：1,200,000">
                        <div class="unit-selector">
                            <button class="unit-btn active" style="pointer-events: none;">元</button>
                        </div>
                    </div>
                </div>

                <!-- 自備款 -->
                <div class="input-group">
                    <label for="input-down-payment">自備款 (頭期款)</label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-down-payment" value="300,000" placeholder="例如：300,000">
                        <div class="unit-selector">
                            <button class="unit-btn active" style="pointer-events: none;">元</button>
                        </div>
                    </div>
                </div>

                <!-- 貸款金額 -->
                <div class="input-group">
                    <label for="input-loan-amount">
                        貸款金額 <span class="badge" id="loan-ratio-badge"><span id="loan-ratio-span">75.0</span>%</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-loan-amount" value="900,000" placeholder="例如：900,000">
                        <div class="unit-selector">
                            <button class="unit-btn active" style="pointer-events: none;">元</button>
                        </div>
                    </div>
                </div>

                <!-- 條件式：寬限期 -->
                <div class="conditional-group" id="group-grace" style="display: none;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="input-grace-period">寬限期 (月)</label>
                        <div class="input-wrapper">
                            <input type="number" id="input-grace-period" value="12" min="0" max="120" placeholder="例如：12">
                            <div class="unit-selector" style="pointer-events: none; background: transparent; border: none; right: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">月</div>
                        </div>
                    </div>
                </div>

                <!-- 條件式：階梯還款 -->
                <div class="conditional-group" id="group-stepped" style="display: none;">
                    <div class="input-group">
                        <label for="input-step-payment">首期每月低付款額</label>
                        <div class="input-wrapper">
                            <input type="text" inputmode="numeric" id="input-step-payment" value="8,888" placeholder="例如：8,888">
                            <div class="unit-selector">
                                <button class="unit-btn active" style="pointer-events: none;">元</button>
                            </div>
                        </div>
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="input-step-periods">低付款期數 (月)</label>
                        <div class="input-wrapper">
                            <input type="number" id="input-step-periods" value="12" min="1" max="120" placeholder="例如：12">
                            <div class="unit-selector" style="pointer-events: none; background: transparent; border: none; right: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">月</div>
                        </div>
                    </div>
                </div>

                <!-- 條件式：尾款保留 -->
                <div class="conditional-group" id="group-balloon" style="display: none;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="input-balloon-amount">
                            保留尾款金額 <span class="badge" id="balloon-ratio-badge"><span id="balloon-ratio-span">33.3</span>%</span>
                        </label>
                        <div class="input-wrapper">
                            <input type="text" inputmode="numeric" id="input-balloon-amount" value="300,000" placeholder="例如：300,000">
                            <div class="unit-selector">
                                <button class="unit-btn active" style="pointer-events: none;">元</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 貸款年利率 -->
                <div class="input-group">
                    <label for="input-rate">年利率 (%)</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-rate" value="2.99" min="0" step="0.01" placeholder="例如：2.99">
                        <div class="unit-selector" style="pointer-events: none; background: transparent; border: none; right: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">%</div>
                    </div>
                </div>

                <!-- 貸款期間 -->
                <div class="input-group">
                    <label for="input-period">貸款期間</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-period" value="5" min="1" placeholder="例如：5">

                <!-- 動保費 / 設定費 -->
                <div class="input-group">
                    <label for="input-fee">動保設定費 / 手續費</label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-fee" value="3,500" placeholder="例如：3,500">
                        <div class="unit-selector" style="pointer-events: none; background: transparent; border: none; right: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">元</div>
                    </div>

                <!-- 還款方式 -->
                <div class="input-group" style="margin-bottom: 0;">
                    <label>還款方式</label>
                    <div class="toggle-buttons-container" id="repay-type-selector">
                        <button class="unit-btn active" data-unit="equal-total">本息均攤</button>
                        <button class="unit-btn" data-unit="equal-principal">本金均攤</button>
                    </div>

            <!-- 右側結果與圖表 -->
            <div class="results-section" id="results-sec">

                <!-- 分享連結按鈕 -->
                <div class="share-btn-wrapper">
                    <button class="share-btn" id="share-btn" onclick="copyShareLink()" title="複製當前配置的查詢連結">
                        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                        <span class="btn-text">複製查詢連結</span>
                    </button>
                </div>

                <!-- 看板 -->
                <div class="indicators-grid">
                    <div class="indicator-card total-value">
                        <h4>每月還款額 (首期)</h4>
                        <div class="value" id="val-monthly">0</div>
                        <span class="caption" id="val-monthly-caption">本息平均攤還</span>
                    </div>
                    <div class="indicator-card">
                        <h4>實質年利率 (APR)</h4>
                        <div class="value" style="color: #ff0055;" id="val-apr">0 %</div>
                        <span class="caption">含設定費攤提真實利率</span>
                    </div>
                    <div class="indicator-card">
                        <h4>總利息支出</h4>
                        <div class="value" id="val-interest">0</div>
                        <span class="caption">貸款期間付出的利息總和</span>
                    </div>
                    <div class="indicator-card">
                        <h4>總還款金額</h4>
                        <div class="value" id="val-total">0</div>
                        <span class="caption" id="val-total-caption">含本息及設定規費</span>
                    </div>
                </div>

                <!-- 圖表 -->
                <div class="chart-container">
                    <canvas id="balance-chart"></canvas>
                </div>

                <!-- 明細表格 -->
                <div class="table-container">
                    <h3 id="table-title">車貸還款明細表</h3>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: left;">期數</th>
                                <th>期初餘額</th>
                                <th>當期本金</th>
                                <th>當期利息</th>
                                <th>當期本息</th>
                                <th>期末餘額</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- 由 JS 動態生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 介面按鈕交互 (單位與模式切換)
        // ==========================================
        function setupSelector(containerId, callback) {
            const container = document.getElementById(containerId);
            const buttons = container.querySelectorAll('.unit-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    // 觸發紅泡沫粒子爆發微動效！
                    createBurst(e.clientX, e.clientY);
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (callback) callback(btn.getAttribute('data-unit'));
                });
            });
        }

        let loanScheme = 'standard';   // 'standard', 'grace', 'stepped', 'balloon'
        let periodUnit = 'year';       // 'year' or 'month'
        let repayType = 'equal-total'; // 'equal-total' or 'equal-principal'

        // 方案解析與風險警告
        const schemeDescriptions = {
            standard: `<strong>一般還款方案 (基礎型，最安全)</strong><br>
                       <span style="color: #8892b0;">• 優點：利息支出最少，每月還款金額穩定，本金持續遞減。<br>
                       • 缺點：無彈性緩衝，適合預算穩定充裕的買車人。<br>
                       • 風險：低風險。建議做為購車時的首選對照基準。</span>`,
            grace: `<strong>寬限期方案 (前息後本，適合前期手頭緊)</strong><br>
                    <span style="color: #ffb800;">• 優點：寬限期內只需繳納利息，每月負擔極小，有資金調度空間。<br>
                    • 缺點：寬限期結束後，由於本金攤還期數縮短，月付額將大幅攀升，總利息支出較多。<br>
                    • 風險：中風險。請確保寬限期結束後，個人收入能夠負擔倍增的月付金。</span>`,
            stepped: `<strong>階梯式還款方案 (首年超低月付)</strong><br>
                      <span style="color: #ff5e3a;">• 優點：前 12 期（或自訂期數）每月僅繳納自訂的超低金額，利於購車初期做資金配置。<br>
                      • 缺點：前期若付低於利息會產生本金反向增加（負攤還），且剩餘本金將在後期被快速攤還，後期月付額變高。<br>
                      • 風險：中高風險。適合社會新鮮人或預計未來收入有顯著成長者，需注意後期本息還款壓力。</span>`,
            balloon: `<strong>尾款保留/氣球貸方案 (理財型 / 高頻率換車)</strong><br>
                      <span style="color: #ff0055;">• 優點：將大筆本金（尾款，通常為 20%-40%）留到最後一期，因此期間的月付額非常低，能開好車。<br>
                      • 缺點：最後一期需一次付清龐大的尾款，且因期間本金還得少，累積總利息是所有方案中最高的。<br>
                      • 風險：高風險（需精算）。最後一期若無力繳清，需有轉貸或賣車（利用原廠保值回收殘值）的準備。</span>`
        };

        function updateSchemeUI() {
            // 隱藏所有條件欄位
            document.getElementById('group-grace').style.display = 'none';
            document.getElementById('group-stepped').style.display = 'none';
            document.getElementById('group-balloon').style.display = 'none';

            // 顯示當前方案之欄位
            if (loanScheme === 'grace') {
                document.getElementById('group-grace').style.display = 'block';
            } else if (loanScheme === 'stepped') {
                document.getElementById('group-stepped').style.display = 'block';
            } else if (loanScheme === 'balloon') {
                document.getElementById('group-balloon').style.display = 'block';
            }

            // 更新方案描述
            document.getElementById('scheme-description').innerHTML = schemeDescriptions[loanScheme];

            calculateLoan();
        }

        // ==========================================
        // 車貸計算核心與圖表渲染
        // ==========================================
        let chartInstance = null;

        function formatCurrency(num) {
            return Math.round(num).toLocaleString('zh-TW');
        }

        // 二分法求解實質年利率 (APR)
        // 使得 貸款金額 - 設定費 = 每月還款額的折現總和
        function calculateAPR(loanAmount, fee, payments) {
            const netAmount = loanAmount - fee;
            if (netAmount <= 0) return 0;

            let low = 0;
            let high = 2; // 月折現率上限 200%
            let mid = 0;

            for (let iter = 0; iter < 80; iter++) {
                mid = (low + high) / 2;
                let npv = -netAmount;
                for (let t = 0; t < payments.length; t++) {
                    npv += payments[t] / Math.pow(1 + mid, t + 1);
                }

                if (npv > 0) {
                    low = mid;
                } else {
                    high = mid;
                }
            }

            return mid * 12 * 100;
        }

        function calculateLoan() {
            const carPrice = parseVal('input-car-price');
            const downPayment = parseVal('input-down-payment');
            const loanAmount = parseVal('input-loan-amount');
            const ratePercent = parseFloat(document.getElementById('input-rate').value) || 0;
            const periodVal = parseFloat(document.getElementById('input-period').value) || 0;
            const fee = parseVal('input-fee');

            // 1. 計算總期數
            const totalMonths = Math.max(0, periodUnit === 'year' ? periodVal * 12 : periodVal);

            // 2. 提取與防呆參數
            let graceMonths = 0;
            let stepPayment = 0;
            let stepPeriods = 0;
            let balloonAmount = 0;

            if (loanScheme === 'grace') {
                let graceInput = parseInt(document.getElementById('input-grace-period').value, 10) || 0;
                if (graceInput < 0) graceInput = 0;
                if (totalMonths > 0 && graceInput >= totalMonths) {
                    graceInput = totalMonths - 1;
                    document.getElementById('input-grace-period').value = graceInput;
                }
                graceMonths = graceInput;
            } else if (loanScheme === 'stepped') {
                stepPayment = parseVal('input-step-payment');
                let stepPeriodsInput = parseInt(document.getElementById('input-step-periods').value, 10) || 0;
                if (stepPeriodsInput < 0) stepPeriodsInput = 0;
                if (totalMonths > 0 && stepPeriodsInput >= totalMonths) {
                    stepPeriodsInput = totalMonths - 1;
                    document.getElementById('input-step-periods').value = stepPeriodsInput;
                }
                stepPeriods = stepPeriodsInput;
            } else if (loanScheme === 'balloon') {
                let balloonInput = parseVal('input-balloon-amount');
                if (balloonInput < 0) balloonInput = 0;
                if (balloonInput > loanAmount) {
                    balloonInput = loanAmount;
                    formatElementValue('input-balloon-amount', balloonInput);
                }
                balloonAmount = balloonInput;

                // 更新尾款百分比
                const balloonRatio = loanAmount > 0 ? (balloonAmount / loanAmount * 100) : 0;
                document.getElementById('balloon-ratio-span').textContent = balloonRatio.toFixed(1);
            }

            // 3. 準備數據模型
            const resultData = [];
            let totalInterest = 0;
            let firstPayment = 0;
            let afterSpecialPayment = 0; // 用於展示寬限期或低付期過後的月付額

            // 初始狀態
            resultData.push({
                period: 0,
                startBalance: 0,
                principalPaid: 0,
                interestPaid: 0,
                totalPayment: 0,
                endBalance: loanAmount,
                statusTag: ''
            });

            if (totalMonths > 0 && loanAmount > 0) {
                const monthlyRate = (ratePercent / 100) / 12;
                const paymentArray = [];
                let remainingBalance = loanAmount;

                if (loanScheme === 'standard') {
                    // === 1. 一般方案 ===
                    if (repayType === 'equal-total') {
                        let monthlyPayment = 0;
                        if (monthlyRate === 0) {
                            monthlyPayment = loanAmount / totalMonths;
                        } else {
                            monthlyPayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
                        }
                        firstPayment = monthlyPayment;

                        for (let m = 1; m <= totalMonths; m++) {
                            const startBal = remainingBalance;
                            const interestThisMonth = remainingBalance * monthlyRate;
                            const principalThisMonth = monthlyPayment - interestThisMonth;
                            remainingBalance -= principalThisMonth;
                            if (m === totalMonths) remainingBalance = 0;

                            totalInterest += interestThisMonth;
                            paymentArray.push(monthlyPayment);

                            resultData.push({
                                period: m,
                                startBalance: startBal,
                                principalPaid: principalThisMonth,
                                interestPaid: interestThisMonth,
                                totalPayment: monthlyPayment,
                                endBalance: Math.max(0, remainingBalance),
                                statusTag: ''
                            });
                        }
                    } else {
                        // 本金均攤
                        const principalPerMonth = loanAmount / totalMonths;
                        for (let m = 1; m <= totalMonths; m++) {
                            const startBal = remainingBalance;
                            const interestThisMonth = remainingBalance * monthlyRate;
                            const totalPaymentThisMonth = principalPerMonth + interestThisMonth;
                            remainingBalance -= principalPerMonth;
                            if (m === totalMonths) remainingBalance = 0;

                            if (m === 1) firstPayment = totalPaymentThisMonth;
                            totalInterest += interestThisMonth;
                            paymentArray.push(totalPaymentThisMonth);

                            resultData.push({
                                period: m,
                                startBalance: startBal,
                                principalPaid: principalPerMonth,
                                interestPaid: interestThisMonth,
                                totalPayment: totalPaymentThisMonth,
                                endBalance: Math.max(0, remainingBalance),
                                statusTag: ''
                            });
                        }
                    }
                } else if (loanScheme === 'grace') {
                    // === 2. 寬限期方案 ===
                    const interestOnlyPayment = loanAmount * monthlyRate;
                    const amortizeMonths = totalMonths - graceMonths;

                    let amortizedMonthlyPayment = 0;
                    if (amortizeMonths > 0) {
                        if (repayType === 'equal-total') {
                            if (monthlyRate === 0) {
                                amortizedMonthlyPayment = loanAmount / amortizeMonths;
                            } else {
                                amortizedMonthlyPayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, amortizeMonths)) / (Math.pow(1 + monthlyRate, amortizeMonths) - 1);
                            }
                        }
                    }

                    firstPayment = graceMonths > 0 ? interestOnlyPayment : (repayType === 'equal-total' ? amortizedMonthlyPayment : (loanAmount / amortizeMonths + loanAmount * monthlyRate));
                    afterSpecialPayment = repayType === 'equal-total' ? amortizedMonthlyPayment : (loanAmount / amortizeMonths + loanAmount * monthlyRate);

                    const principalPerMonth = (repayType === 'equal-principal' && amortizeMonths > 0) ? loanAmount / amortizeMonths : 0;

                    for (let m = 1; m <= totalMonths; m++) {
                        const startBal = remainingBalance;
                        let interestThisMonth = remainingBalance * monthlyRate;
                        let principalThisMonth = 0;
                        let totalPaymentThisMonth = 0;
                        let statusTag = '';

                        if (m <= graceMonths) {
                            // 寬限期
                            principalThisMonth = 0;
                            totalPaymentThisMonth = interestOnlyPayment;
                            statusTag = '[寬限]';
                        } else {
                            // 攤還期
                            if (repayType === 'equal-total') {
                                totalPaymentThisMonth = amortizedMonthlyPayment;
                                principalThisMonth = totalPaymentThisMonth - interestThisMonth;
                                remainingBalance -= principalThisMonth;
                            } else {
                                principalThisMonth = principalPerMonth;
                                totalPaymentThisMonth = principalThisMonth + interestThisMonth;
                                remainingBalance -= principalThisMonth;
                                if (m === graceMonths + 1) {
                                    afterSpecialPayment = totalPaymentThisMonth; // 本金均攤首期最大
                                }
                            }
                        }

                        if (m === totalMonths) remainingBalance = 0;

                        totalInterest += interestThisMonth;
                        paymentArray.push(totalPaymentThisMonth);

                        resultData.push({
                            period: m,
                            startBalance: startBal,
                            principalPaid: principalThisMonth,
                            interestPaid: interestThisMonth,
                            totalPayment: totalPaymentThisMonth,
                            endBalance: Math.max(0, remainingBalance),
                            statusTag: statusTag
                        });
                    }
                } else if (loanScheme === 'stepped') {
                    // === 3. 階梯式方案 ===
                    // 前 stepPeriods 期支付 stepPayment
                    for (let m = 1; m <= stepPeriods; m++) {
                        const startBal = remainingBalance;
                        let interestThisMonth = remainingBalance * monthlyRate;
                        let principalThisMonth = 0;
                        let totalPaymentThisMonth = 0;

                        if (remainingBalance <= 0) {
                            interestThisMonth = 0;
                            principalThisMonth = 0;
                            totalPaymentThisMonth = 0;
                        } else {
                            totalPaymentThisMonth = Math.min(stepPayment, remainingBalance + interestThisMonth);
                            principalThisMonth = totalPaymentThisMonth - interestThisMonth;
                            remainingBalance -= principalThisMonth;
                        }

                        totalInterest += interestThisMonth;
                        paymentArray.push(totalPaymentThisMonth);

                        resultData.push({
                            period: m,
                            startBalance: startBal,
                            principalPaid: principalThisMonth,
                            interestPaid: interestThisMonth,
                            totalPayment: totalPaymentThisMonth,
                            endBalance: Math.max(0, remainingBalance),
                            statusTag: '[低付]'
                        });
                    }

                    // 剩餘攤還期數與本金
                    const amortizeMonths = totalMonths - stepPeriods;
                    const balanceAfterStep = Math.max(0, remainingBalance);

                    let amortizedMonthlyPayment = 0;
                    if (amortizeMonths > 0 && balanceAfterStep > 0) {
                        if (repayType === 'equal-total') {
                            if (monthlyRate === 0) {
                                amortizedMonthlyPayment = balanceAfterStep / amortizeMonths;
                            } else {
                                amortizedMonthlyPayment = balanceAfterStep * (monthlyRate * Math.pow(1 + monthlyRate, amortizeMonths)) / (Math.pow(1 + monthlyRate, amortizeMonths) - 1);
                            }
                        }
                    }

                    firstPayment = stepPeriods > 0 ? stepPayment : (repayType === 'equal-total' ? amortizedMonthlyPayment : (balanceAfterStep / amortizeMonths + balanceAfterStep * monthlyRate));
                    afterSpecialPayment = repayType === 'equal-total' ? amortizedMonthlyPayment : (balanceAfterStep / amortizeMonths + balanceAfterStep * monthlyRate);

                    const principalPerMonth = (repayType === 'equal-principal' && amortizeMonths > 0) ? balanceAfterStep / amortizeMonths : 0;

                    for (let m = stepPeriods + 1; m <= totalMonths; m++) {
                        const startBal = remainingBalance;
                        let interestThisMonth = remainingBalance * monthlyRate;
                        let principalThisMonth = 0;
                        let totalPaymentThisMonth = 0;

                        if (repayType === 'equal-total') {
                            totalPaymentThisMonth = amortizedMonthlyPayment;
                            principalThisMonth = totalPaymentThisMonth - interestThisMonth;
                            remainingBalance -= principalThisMonth;
                        } else {
                            principalThisMonth = principalPerMonth;
                            totalPaymentThisMonth = principalThisMonth + interestThisMonth;
                            remainingBalance -= principalThisMonth;
                            if (m === stepPeriods + 1) {
                                afterSpecialPayment = totalPaymentThisMonth;
                            }
                        }

                        if (m === totalMonths) remainingBalance = 0;

                        totalInterest += interestThisMonth;
                        paymentArray.push(totalPaymentThisMonth);

                        resultData.push({
                            period: m,
                            startBalance: startBal,
                            principalPaid: principalThisMonth,
                            interestPaid: interestThisMonth,
                            totalPayment: totalPaymentThisMonth,
                            endBalance: Math.max(0, remainingBalance),
                            statusTag: ''
                        });
                    }
                } else if (loanScheme === 'balloon') {
                    // === 4. 尾款保留方案 (氣球貸) ===
                    let balloonMonthlyPayment = 0;
                    if (repayType === 'equal-total') {
                        if (monthlyRate === 0) {
                            balloonMonthlyPayment = (loanAmount - balloonAmount) / totalMonths;
                        } else {
                            balloonMonthlyPayment = (loanAmount * monthlyRate * Math.pow(1 + monthlyRate, totalMonths) - balloonAmount * monthlyRate) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
                        }
                    }
                    
                    const principalPerMonth = (loanAmount - balloonAmount) / totalMonths;
                    firstPayment = repayType === 'equal-total' ? balloonMonthlyPayment : (principalPerMonth + loanAmount * monthlyRate);

                    for (let m = 1; m <= totalMonths; m++) {
                        const startBal = remainingBalance;
                        let interestThisMonth = remainingBalance * monthlyRate;
                        let principalThisMonth = 0;
                        let totalPaymentThisMonth = 0;
                        let statusTag = '';

                        if (m < totalMonths) {
                            // 1 至 N-1 期
                            if (repayType === 'equal-total') {
                                totalPaymentThisMonth = balloonMonthlyPayment;
                                principalThisMonth = totalPaymentThisMonth - interestThisMonth;
                                remainingBalance -= principalThisMonth;
                            } else {
                                principalThisMonth = principalPerMonth;
                                totalPaymentThisMonth = principalThisMonth + interestThisMonth;
                                remainingBalance -= principalThisMonth;
                            }
                        } else {
                            // 最後一期 (繳清剩餘，含尾款)
                            principalThisMonth = startBal;
                            totalPaymentThisMonth = principalThisMonth + interestThisMonth;
                            remainingBalance = 0;
                            statusTag = '[含尾款]';
                        }

                        if (m === totalMonths) remainingBalance = 0;

                        totalInterest += interestThisMonth;
                        paymentArray.push(totalPaymentThisMonth);

                        resultData.push({
                            period: m,
                            startBalance: startBal,
                            principalPaid: principalThisMonth,
                            interestPaid: interestThisMonth,
                            totalPayment: totalPaymentThisMonth,
                            endBalance: Math.max(0, remainingBalance),
                            statusTag: statusTag
                        });
                    }
                }

                // 計算實質年利率 (APR)
                const apr = calculateAPR(loanAmount, fee, paymentArray);
                document.getElementById('val-apr').textContent = apr.toFixed(2) + ' %';
            } else {
                document.getElementById('val-apr').textContent = ratePercent.toFixed(2) + ' %';
            }

            // 4. 更新指標看板與文字提示
            document.getElementById('val-monthly').textContent = formatCurrency(firstPayment);
            
            // 首期月付額副標提示
            const methodText = repayType === 'equal-total' ? '本息均攤' : '本金均攤';
            if (loanScheme === 'standard') {
                document.getElementById('val-monthly-caption').textContent = 
                    `採用${methodText}${repayType === 'equal-principal' ? '（首月最高，逐月遞減）' : ''}`;
            } else if (loanScheme === 'grace') {
                if (graceMonths > 0) {
                    document.getElementById('val-monthly-caption').innerHTML = 
                        `<span style="color:#ff0055;">前 ${graceMonths} 期寬限付息</span>，第 ${graceMonths + 1} 期起首月繳 $${formatCurrency(afterSpecialPayment)}`;
                } else {
                    document.getElementById('val-monthly-caption').textContent = `採用${methodText}（未設定寬限期）`;
                }
            } else if (loanScheme === 'stepped') {
                if (stepPeriods > 0) {
                    document.getElementById('val-monthly-caption').innerHTML = 
                        `<span style="color:#ff0055;">前 ${stepPeriods} 期低付 $${formatCurrency(stepPayment)}</span>，第 ${stepPeriods + 1} 期起首月繳 $${formatCurrency(afterSpecialPayment)}`;
                } else {
                    document.getElementById('val-monthly-caption').textContent = `採用${methodText}（未設定低付期）`;
                }
            } else if (loanScheme === 'balloon') {
                if (balloonAmount > 0) {
                    document.getElementById('val-monthly-caption').innerHTML = 
                        `月付額 $${formatCurrency(firstPayment)}，<span style="color:#ff0055;">最後一期需付尾款 $${formatCurrency(balloonAmount)}</span>`;
                } else {
                    document.getElementById('val-monthly-caption').textContent = `採用${methodText}（未保留尾款）`;
                }
            }

            document.getElementById('val-interest').textContent = formatCurrency(totalInterest);
            document.getElementById('val-total').textContent = formatCurrency(loanAmount + totalInterest + fee);
            document.getElementById('val-total-caption').textContent = `含本金、利息與 $${formatCurrency(fee)} 設定費`;

            // 5. 更新明細表格
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            resultData.forEach(item => {
                const tr = document.createElement('tr');
                const isInitial = item.period === 0;
                
                let periodLabel = isInitial ? '初始' : `第 ${item.period} 期`;
                if (item.statusTag) {
                    periodLabel += ` <span style="font-size:0.75rem; color:#ff0055; padding-left:2px;">${item.statusTag}</span>`;
                }

                tr.innerHTML = `
                    <td style="text-align: left; color: var(--text-secondary);">${periodLabel}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.startBalance)}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.principalPaid)}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.interestPaid)}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.totalPayment)}</td>
                    <td style="color: #ff0055; font-weight: 500;">${formatCurrency(item.endBalance)}</td>
                `;
                tbody.appendChild(tr);
            });

            // 6. 更新 Chart.js 圖表 (賸餘本金折線圖)
            const labels = resultData.map(item => isNaN(item.period) || item.period === 0 ? '初始' : `第 ${item.period} 期`);
            const balanceDataset = resultData.map(item => item.endBalance);

            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctxChart = document.getElementById('balance-chart').getContext('2d');
            chartInstance = new Chart(ctxChart, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '賸餘本金餘額',
                            data: balanceDataset,
                            backgroundColor: 'rgba(255, 0, 85, 0.1)',
                            borderColor: 'rgba(255, 0, 85, 0.85)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1,
                            pointRadius: labels.length > 50 ? 0 : 2,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#8892b0',
                                font: { family: 'Inter' }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + formatCurrency(context.parsed.y);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { color: '#8892b0', font: { family: 'Inter' } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { 
                                color: '#8892b0', 
                                font: { family: 'Inter' },
                                callback: function(value) {
                                    return value >= 1000000 
                                        ? (value / 1000000).toFixed(1) + 'M' 
                                        : value >= 1000 ? (value / 1000).toFixed(0) + 'K' : value;
                                }
                            }
                        }
                    }
                }
            });

            // 顯示結果區塊
            const resSec = document.getElementById('results-sec');
            resSec.classList.add('show');
        }

        // ==========================================
        // 車貸輸入關聯性同步
        // ==========================================
        function parseVal(id) {
            return parseFloat(document.getElementById(id).value.replace(/,/g, '')) || 0;
        }

        function formatElementValue(id, val) {
            const el = document.getElementById(id);
            el.value = Math.round(val).toLocaleString('zh-TW');
        }

        function syncInputs(changedId) {
            let carPrice = parseVal('input-car-price');
            let downPayment = parseVal('input-down-payment');
            let loanAmount = parseVal('input-loan-amount');

            if (changedId === 'input-car-price') {
                if (carPrice < 0) carPrice = 0;
                if (downPayment > carPrice) {
                    downPayment = carPrice;
                    formatElementValue('input-down-payment', downPayment);
                }
                loanAmount = carPrice - downPayment;
                formatElementValue('input-loan-amount', loanAmount);
            } else if (changedId === 'input-down-payment') {
                if (downPayment < 0) downPayment = 0;
                if (downPayment > carPrice) {
                    downPayment = carPrice;
                    formatElementValue('input-down-payment', downPayment);
                }
                loanAmount = carPrice - downPayment;
                formatElementValue('input-loan-amount', loanAmount);
            } else if (changedId === 'input-loan-amount') {
                if (loanAmount < 0) loanAmount = 0;
                if (loanAmount > carPrice) {
                    loanAmount = carPrice;
                    formatElementValue('input-loan-amount', loanAmount);
                }
                downPayment = carPrice - loanAmount;
                formatElementValue('input-down-payment', downPayment);
            }

            // 計算貸款成數百分比
            const ratio = carPrice > 0 ? (loanAmount / carPrice * 100) : 0;
            document.getElementById('loan-ratio-span').textContent = ratio.toFixed(1);

            // 若尾款金額大於新的貸款金額，需限制之
            if (loanScheme === 'balloon') {
                let balloonVal = parseVal('input-balloon-amount');
                if (balloonVal > loanAmount) {
                    balloonVal = loanAmount;
                    formatElementValue('input-balloon-amount', balloonVal);
                }
                const balloonRatio = loanAmount > 0 ? (balloonVal / loanAmount * 100) : 0;
                document.getElementById('balloon-ratio-span').textContent = balloonRatio.toFixed(1);
            }

            calculateLoan();
        }

        // 綁定輸入千分位格式化與游標維持
        function bindSyncedInput(id) {
            const input = document.getElementById(id);
            input.addEventListener('input', (e) => {
                let rawVal = input.value.replace(/,/g, '');
                if (rawVal === '') {
                    input.value = '';
                    if (id === 'input-car-price') {
                        formatElementValue('input-loan-amount', 0);
                        formatElementValue('input-down-payment', 0);
                    } else if (id === 'input-down-payment') {
                        const carPrice = parseVal('input-car-price');
                        formatElementValue('input-loan-amount', carPrice);
                    } else if (id === 'input-loan-amount') {
                        const carPrice = parseVal('input-car-price');
                        formatElementValue('input-down-payment', carPrice);
                    }
                    document.getElementById('loan-ratio-span').textContent = '0.0';
                    calculateLoan();
                    return;
                }

                const num = parseInt(rawVal, 10);
                if (!isNaN(num)) {
                    const originalCursor = input.selectionStart;
                    const originalCommaCount = (input.value.substring(0, originalCursor).match(/,/g) || []).length;
                    
                    const formatted = num.toLocaleString('zh-TW');
                    input.value = formatted;
                    
                    const newCommaCount = (formatted.substring(0, originalCursor).match(/,/g) || []).length;
                    const cursorOffset = newCommaCount - originalCommaCount;
                    input.setSelectionRange(originalCursor + cursorOffset, originalCursor + cursorOffset);
                }

                syncInputs(id);
            });
        }

        // 單獨格式化非連動之金額輸入框
        function initFormattedInput(inputId) {
            const input = document.getElementById(inputId);
            input.addEventListener('input', () => {
                let value = input.value.replace(/,/g, '');
                if (value === '') {
                    input.value = '';
                    calculateLoan();
                    return;
                }
                const num = parseInt(value, 10);
                if (!isNaN(num)) {
                    const originalCursor = input.selectionStart;
                    const originalCommaCount = (input.value.substring(0, originalCursor).match(/,/g) || []).length;
                    
                    const formatted = num.toLocaleString('zh-TW');
                    input.value = formatted;
                    
                    const newCommaCount = (formatted.substring(0, originalCursor).match(/,/g) || []).length;
                    const cursorOffset = newCommaCount - originalCommaCount;
                    input.setSelectionRange(originalCursor + cursorOffset, originalCursor + cursorOffset);
                }
                calculateLoan();
            });

            if (input.value) {
                const num = parseInt(input.value.replace(/,/g, ''), 10);
                if (!isNaN(num)) {
                    input.value = num.toLocaleString('zh-TW');
                }
            }
        }

        // ==========================================
        // URL 雙向連動 (車貸計算器)
        // ==========================================
        function safeParseFloat(val, fallback) {
            const n = parseFloat(val);
            return (isFinite(n) && !isNaN(n)) ? n : fallback;
        }
        function safeParseAllowed(val, allowed, fallback) {
            return allowed.includes(val) ? val : fallback;
        }

        function syncToURL() {
            const params = new URLSearchParams();
            params.set('cp', document.getElementById('input-car-price').value.replace(/,/g, ''));
            params.set('dp', document.getElementById('input-down-payment').value.replace(/,/g, ''));
            params.set('la', document.getElementById('input-loan-amount').value.replace(/,/g, ''));
            params.set('r',  document.getElementById('input-rate').value);
            params.set('t',  document.getElementById('input-period').value);
            params.set('f',  document.getElementById('input-fee').value.replace(/,/g, ''));
            params.set('gp', document.getElementById('input-grace-period').value);
            params.set('sp', document.getElementById('input-step-payment').value.replace(/,/g, ''));
            params.set('sk', document.getElementById('input-step-periods').value);
            params.set('ba', document.getElementById('input-balloon-amount').value.replace(/,/g, ''));
            params.set('ls', loanScheme);
            params.set('pu', periodUnit);
            params.set('rt', repayType);
            history.replaceState(null, '', '?' + params.toString());
        }

        let urlDebounceTimer = null;
        function syncToURLDebounced() {
            clearTimeout(urlDebounceTimer);
            urlDebounceTimer = setTimeout(syncToURL, 300);
        }

        function initFromURL() {
            const params = new URLSearchParams(window.location.search);
            if (!params.toString()) return false;

            const lsParam = params.get('ls');
            const puParam = params.get('pu');
            const rtParam = params.get('rt');
            const schemes = ['standard', 'grace', 'stepped', 'balloon'];
            loanScheme = safeParseAllowed(lsParam, schemes, 'standard');
            if (puParam === 'year' || puParam === 'month') periodUnit = puParam;
            if (rtParam === 'equal-total' || rtParam === 'equal-principal') repayType = rtParam;

            function activateBtn(containerId, unit) {
                const c = document.getElementById(containerId);
                if (!c) return;
                c.querySelectorAll('.unit-btn').forEach(b => {
                    if (b.getAttribute('data-unit') === unit) b.classList.add('active');
                    else b.classList.remove('active');
                });
            }
            activateBtn('loan-scheme-selector', loanScheme);
            activateBtn('period-unit-selector', periodUnit);
            activateBtn('repay-type-selector', repayType);

            // 金額欄位
            document.getElementById('input-car-price').value     = safeParseFloat(params.get('cp'), 1200000).toLocaleString('zh-TW');
            document.getElementById('input-down-payment').value  = safeParseFloat(params.get('dp'), 300000).toLocaleString('zh-TW');
            document.getElementById('input-loan-amount').value   = safeParseFloat(params.get('la'), 900000).toLocaleString('zh-TW');
            document.getElementById('input-balloon-amount').value = safeParseFloat(params.get('ba'), 300000).toLocaleString('zh-TW');
            document.getElementById('input-step-payment').value  = safeParseFloat(params.get('sp'), 8888).toLocaleString('zh-TW');
            document.getElementById('input-fee').value           = safeParseFloat(params.get('f'), 3500).toLocaleString('zh-TW');
            // 數字欄位
            document.getElementById('input-rate').value          = safeParseFloat(params.get('r'), 2.99);
            document.getElementById('input-period').value        = safeParseFloat(params.get('t'), 5);
            document.getElementById('input-grace-period').value  = safeParseFloat(params.get('gp'), 12);
            document.getElementById('input-step-periods').value  = safeParseFloat(params.get('sk'), 12);

            updateSchemeUI();
            return true;
        }

        function copyShareLink() {
            syncToURL();
            const url = window.location.href;
            const btn = document.getElementById('share-btn');
            const btnText = btn.querySelector('.btn-text');
            navigator.clipboard.writeText(url).then(() => {
                btn.classList.add('copied');
                btn.querySelector('svg').innerHTML = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>';
                btnText.textContent = '已複製！';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.querySelector('svg').innerHTML = '<path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>';
                    btnText.textContent = '複製查詢連結';
                }, 2200);
            }).catch(() => window.prompt('請手動複製以下連結：', url));
        }

        // 初始化與事件綁定
        window.addEventListener('load', () => {
            // 先嘗試從 URL 初始化
            const loadedFromURL = initFromURL();

            bindSyncedInput('input-car-price');
            bindSyncedInput('input-down-payment');
            bindSyncedInput('input-loan-amount');
            initFormattedInput('input-fee');
            initFormattedInput('input-step-payment');

            // 分享連結按鈕需要之金額欄位防抖同步
            ['input-car-price', 'input-down-payment', 'input-loan-amount',
             'input-fee', 'input-step-payment'].forEach(id => {
                document.getElementById(id).addEventListener('input', syncToURLDebounced);
                document.getElementById(id).addEventListener('blur', syncToURL);
            });

            // 尾款保留金額單獨綁定
            const balloonInput = document.getElementById('input-balloon-amount');
            balloonInput.addEventListener('input', () => {
                let value = balloonInput.value.replace(/,/g, '');
                if (value === '') {
                    balloonInput.value = '';
                    document.getElementById('balloon-ratio-span').textContent = '0.0';
                    calculateLoan();
                    syncToURLDebounced();
                    return;
                }
                let num = parseInt(value, 10);
                if (!isNaN(num)) {
                    const loanAmount = parseVal('input-loan-amount');
                    if (num > loanAmount) { num = loanAmount; }
                    const originalCursor = balloonInput.selectionStart;
                    const originalCommaCount = (balloonInput.value.substring(0, originalCursor).match(/,/g) || []).length;
                    const formatted = num.toLocaleString('zh-TW');
                    balloonInput.value = formatted;
                    const newCommaCount = (formatted.substring(0, originalCursor).match(/,/g) || []).length;
                    const cursorOffset = newCommaCount - originalCommaCount;
                    balloonInput.setSelectionRange(originalCursor + cursorOffset, originalCursor + cursorOffset);
                }
                const curBalloon = parseVal('input-balloon-amount');
                const loanAmount = parseVal('input-loan-amount');
                const balloonRatio = loanAmount > 0 ? (curBalloon / loanAmount * 100) : 0;
                document.getElementById('balloon-ratio-span').textContent = balloonRatio.toFixed(1);
                calculateLoan();
                syncToURLDebounced();
            });
            balloonInput.addEventListener('blur', syncToURL);

            // 格式化預設值
            if (!loadedFromURL) {
                formatElementValue('input-car-price',    parseVal('input-car-price'));
                formatElementValue('input-down-payment', parseVal('input-down-payment'));
                formatElementValue('input-loan-amount',  parseVal('input-loan-amount'));
                formatElementValue('input-step-payment', parseVal('input-step-payment'));
                formatElementValue('input-balloon-amount', parseVal('input-balloon-amount'));
            }

            document.getElementById('input-rate').addEventListener('input', () => { calculateLoan(); syncToURLDebounced(); });
            document.getElementById('input-period').addEventListener('input', () => { calculateLoan(); syncToURLDebounced(); });
            document.getElementById('input-grace-period').addEventListener('input', () => { calculateLoan(); syncToURLDebounced(); });
            document.getElementById('input-step-periods').addEventListener('input', () => { calculateLoan(); syncToURLDebounced(); });

            // 初始化方案選擇器與 UI
            function setupWithURL(containerId, callback) {
                const container = document.getElementById(containerId);
                container.querySelectorAll('.unit-btn').forEach(btn => {
                    const fresh = btn.cloneNode(true);
                    btn.parentNode.replaceChild(fresh, btn);
                });
                container.querySelectorAll('.unit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        createBurst(e.clientX, e.clientY);
                        container.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        if (callback) callback(btn.getAttribute('data-unit'));
                        syncToURL();
                    });
                });
            }
            setupWithURL('loan-scheme-selector', (scheme) => { loanScheme = scheme; updateSchemeUI(); });
            setupWithURL('period-unit-selector', (unit) => { periodUnit = unit; calculateLoan(); });
            setupWithURL('repay-type-selector', (type) => { repayType = type; calculateLoan(); });

            // 初次計算
            if (!loadedFromURL) {
                syncInputs('input-car-price');
            }
            updateSchemeUI();
        });
    </script>

    <script src="../js/common-particles.js" defer></script>
