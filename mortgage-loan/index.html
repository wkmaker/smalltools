    <style>
        :root {
            --bg-color: #030305;
            --glass-bg: rgba(255, 255, 255, 0.015);
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent-glow: rgba(0, 245, 160, 0.6); /* 霓虹薄荷綠主題 */
            --accent-glow-rgb: 0, 245, 160;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1rem;
        }

        /* 互動式 Canvas 背景 */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 玻璃擬物化容器 */
        .glass-container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.01);
            width: 100%;
            max-width: 90%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 回首頁按鈕 */
        .back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            z-index: 11;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(0, 245, 160, 0.1);
            color: #00f5a0;
            border-color: #00f5a0;
            box-shadow: 0 0 15px rgba(0, 245, 160, 0.2);
        }

        .back-btn:hover svg {
            transform: translateX(-3px);
        }

        h1 {
            font-weight: 300;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-align: center;
            text-transform: uppercase;
        }

        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            box-shadow: 0 0 8px var(--accent-glow);
            margin: 0.8rem auto 0;
            animation: glow-pulse 3s infinite ease-in-out;
        }

        .subtitle-top {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 3rem;
            text-align: center;
            text-transform: uppercase;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 1px var(--accent-glow)); }
            50% { opacity: 1; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        }

        /* 雙欄版面 */
        .calculator-grid {
            display: grid;
            grid-template-columns: 1.15fr 1.85fr;
            gap: 2.5rem;
            align-items: start;
        }

        /* ====== 左側表單樣式 ====== */

            border-radius: 16px;

            font-size: 0.85rem;
            letter-spacing: 1px;

            font-family: 'Inter', sans-serif;
            font-size: 1rem;

        .input-wrapper input:focus {
            border-color: rgba(0, 245, 160, 0.6);
            box-shadow: 0 0 15px rgba(0, 245, 160, 0.1);
        }

        /* 單位切換選擇器與純單位顯示 */
        .unit-selector {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .unit-selector .unit-btn,
        .toggle-buttons-container .unit-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .unit-selector .unit-btn.active,
        .toggle-buttons-container .unit-btn.active {
            background: rgba(0, 245, 160, 0.15);
            color: #00f5a0;
        }

        .unit-display {
            position: absolute;
            right: 12px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            pointer-events: none;
            user-select: none;
        }

        /* 獨立切換按鈕組樣式 */
        .toggle-buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            width: 100%;
        }

        .toggle-buttons-container .unit-btn {
            padding: 0.6rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: center;
            transition: all 0.3s ease;
            height: auto;
            display: block;
        }

        .toggle-buttons-container .unit-btn.active {
            background: rgba(0, 245, 160, 0.12);
            border: 1px solid rgba(0, 245, 160, 0.3);
            box-shadow: 0 0 10px rgba(0, 245, 160, 0.1);
        }

        /* 多段式利率階梯表單 */
        .multi-stage-box {
            background: rgba(255, 255, 255, 0.015);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .stage-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            align-items: center;
        }

        .stage-row-title {
            font-size: 0.75rem;
            color: #00f5a0;
            letter-spacing: 1px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 段落移除按鈕 */
        .stage-remove-btn {
            background: rgba(255, 80, 80, 0.08);
            border: 1px solid rgba(255, 80, 80, 0.2);
            color: rgba(255, 100, 100, 0.7);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.2;
        }
        .stage-remove-btn:hover {
            background: rgba(255, 80, 80, 0.18);
            color: #ff6464;
        }

        /* 最後一段的標題 */
        .stage-last-title {
            font-size: 0.75rem;
            color: rgba(0, 245, 160, 0.6);
            letter-spacing: 1px;
            font-style: italic;
        }

        /* 新增段落按鈕 */
        .add-stage-btn {
            width: 100%;
            background: rgba(0, 245, 160, 0.06);
            border: 1px dashed rgba(0, 245, 160, 0.3);
            color: #00f5a0;
            border-radius: 8px;
            padding: 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            margin-top: 0.2rem;
        }
        .add-stage-btn:hover {
            background: rgba(0, 245, 160, 0.12);
            border-style: solid;
        }
        .add-stage-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-style: dashed;
        }

        /* 段落內的年/月 unit-selector 微型版本 */
        .stage-unit-selector {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stage-unit-selector .unit-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0 0.55rem;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stage-unit-selector .unit-btn.active {
            background: rgba(0, 245, 160, 0.18);
            color: #00f5a0;
        }

        /* ====== 右側結果樣式 ====== */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            min-width: 0; /* 防止子元素撐寬 Grid Item */
        }

        .results-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 指標看板 */
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
        }

        .indicator-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .indicator-card:hover {
            border-color: rgba(0, 245, 160, 0.25);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .indicator-card h4 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
        }

        .indicator-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }



        /* 圖表區 */
        .chart-container {
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            height: 350px;
            width: 100%;
        }

        /* 明細表格區 */
        .table-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem 0;
            width: 100%;
            max-width: 100%;
            overflow-x: auto; /* 手機水平滾動 */
        }

        .table-container h3 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 1.2rem;
            color: var(--text-primary);
            padding: 0 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 650px; /* 防擠壓最小寬度 */
        }

        th, td {
            padding: 0.9rem 1rem;
            text-align: right;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        th:last-child, td:last-child {
            padding-right: 1.5rem;
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 首欄期數 Sticky 凍結 */
        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
            background-color: #0b0b0e; /* 實底色防重疊 */
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.4);
            padding-left: 1.5rem;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.015);
        }

        /* 響應式微調 */
        @media (max-width: 900px) {
            .back-btn {
                position: static;
                display: inline-flex;
                margin-bottom: 1.5rem;
            }
            .calculator-grid {
                grid-template-columns: minmax(0, 1fr); /* 確保網格不被大表格撐開 */
            }
            .glass-container {
                padding: 2.5rem 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .indicators-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .chart-container {
                height: 280px;
            }
        }

        /* 隱藏原生數字微調 Spinner */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* ====== 分享連結按鈕 (霧虹紫主題) ====== */
        .share-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -0.5rem;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(0, 245, 160, 0.06);
            border: 1px solid rgba(0, 245, 160, 0.25);
            color: rgba(0, 245, 160, 0.75);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .share-btn:hover {
            background: rgba(0, 245, 160, 0.12);
            border-color: rgba(0, 245, 160, 0.6);
            color: #00f5a0;
            box-shadow: 0 0 16px rgba(0, 245, 160, 0.15);
        }
        .share-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .share-btn:hover svg { transform: rotate(-8deg) scale(1.15); }
        .share-btn.copied {
            background: rgba(76, 217, 100, 0.1);
            border-color: rgba(76, 217, 100, 0.5);
            color: #4cd964;
            box-shadow: 0 0 14px rgba(76, 217, 100, 0.15);
        }
        .share-btn .btn-text { transition: all 0.2s ease; }
            .page-description {
            max-width: 800px;

        }

        /* 組合貸款子卡片樣式 */
        .sub-card {
            background: rgba(255, 255, 255, 0.015);

        .sub-card-title {

    <div class="glass-container">

            工具庫首頁

        <h1>線上房屋貸款試算器</h1>
        <div class="subtitle-top">Mortgage Loan Calculator</div>
        <p class="page-description">專業免費的線上房貸計算機，支援房屋總價與自備款成數連動、寬限期與多段階梯利率設定，提供 APR 實質年利率與完整每月還款攤銷表。</p>

        <div class="calculator-grid">
            <!-- 左側表單 -->
            <div class="form-section">
                <!-- 房屋總價 -->
                <div class="input-group">
                    <label for="input-total-price">房屋總價 (元)</label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="decimal" id="input-total-price" value="15,000,000" placeholder="例如：15,000,000">

                    </div>
                </div>

                    <label for="input-down-payment-percent">自備款成數</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-down-payment-percent" value="20" min="0" max="100" step="0.5" placeholder="成數">
                        <div class="unit-display">%</div>
                    </div>
                </div>

                <!-- 自備款金額 -->
                <div class="input-group">

    <script>
        // ==========================================
        // 介面按鈕交互 (單位與模式切換)
        // ==========================================
        function setupSelector(containerId, callback) {
            const container = document.getElementById(containerId);
            const buttons = container.querySelectorAll('.unit-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    // 觸發紫色粒子爆發微動效！
                    createBurst(e.clientX, e.clientY);
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (callback) callback(btn.getAttribute('data-unit'));
                });
            });
        }

        let periodUnit = 'year';       // 'year' or 'month'
        let graceUnit = 'year';        // 'year' or 'month'
        let rateType = 'single';       // 'single' or 'multi'
        let repayType = 'equal-total'; // 'equal-total' or 'equal-principal'
        let loanMode = 'single';       // 'single' or 'combined'

        // 貸款 1 (A) 與 貸款 2 (B) 的設定值
        let periodUnit1 = 'year';
        let graceUnit1 = 'year';
        let rateType1 = 'single';
        let repayType1 = 'equal-total';

        let periodUnit2 = 'year';
        let graceUnit2 = 'year';
        let rateType2 = 'single';
        let repayType2 = 'equal-total';

        setupSelector('period-unit-selector', (unit) => { periodUnit = unit; calculateLoan(); });
        setupSelector('grace-unit-selector', (unit) => { graceUnit = unit; calculateLoan(); });
        
        setupSelector('rate-type-selector', (type) => { 
            rateType = type; 
            const singleBox = document.getElementById('single-rate-box');
            const multiBox = document.getElementById('multi-rate-box');
            if (type === 'single') {
                singleBox.style.display = 'block';
                multiBox.style.display = 'none';
            } else {
                singleBox.style.display = 'none';
                multiBox.style.display = 'block';
            }
            calculateLoan(); 
        });

        setupSelector('repay-type-selector', (type) => { repayType = type; calculateLoan(); });

        // 貸款模式切換
        setupSelector('loan-mode-selector', (mode) => {
            loanMode = mode;
            const singleSection = document.getElementById('single-loan-inputs');
            const combinedSection = document.getElementById('combined-loan-inputs');
            if (mode === 'single') {
                singleSection.style.display = 'block';
                combinedSection.style.display = 'none';
            } else {
                singleSection.style.display = 'none';
                combinedSection.style.display = 'block';
                // 切換時做一次金額重新分配
                const loanInput = document.getElementById('input-loan-amount');
                const loanInput1 = document.getElementById('input-loan-amount-1');
                const loanInput2 = document.getElementById('input-loan-amount-2');
                const loanTotal = parseNumberFromCommas(loanInput.value);
                const currentA = parseNumberFromCommas(loanInput1.value);
                const currentB = parseNumberFromCommas(loanInput2.value);
                // 如果兩者和不等於總額，則重新智慧分配
                if (currentA + currentB !== loanTotal) {
                    const newLoanA = Math.min(loanTotal, 10000000);
                    const newLoanB = Math.max(0, loanTotal - newLoanA);
                    loanInput1.value = formatNumberWithCommas(newLoanA);
                    loanInput2.value = formatNumberWithCommas(newLoanB);
                }
            }
            calculateLoan();
        });

        // 貸款 A 設定
        setupSelector('period-unit-selector-1', (unit) => { periodUnit1 = unit; calculateLoan(); });
        setupSelector('grace-unit-selector-1', (unit) => { graceUnit1 = unit; calculateLoan(); });
        setupSelector('repay-type-selector-1', (type) => { repayType1 = type; calculateLoan(); });
        setupSelector('rate-type-selector-1', (type) => {
            rateType1 = type;
            const singleBox = document.getElementById('single-rate-box-1');
            const multiBox = document.getElementById('multi-rate-box-1');
            if (type === 'single') {
                singleBox.style.display = 'block';
                multiBox.style.display = 'none';
            } else {
                singleBox.style.display = 'none';
                multiBox.style.display = 'block';
            }
            calculateLoan();
        });

        // 貸款 B 設定
        setupSelector('period-unit-selector-2', (unit) => { periodUnit2 = unit; calculateLoan(); });
        setupSelector('grace-unit-selector-2', (unit) => { graceUnit2 = unit; calculateLoan(); });
        setupSelector('repay-type-selector-2', (type) => { repayType2 = type; calculateLoan(); });
        setupSelector('rate-type-selector-2', (type) => {
            rateType2 = type;
            const singleBox = document.getElementById('single-rate-box-2');
            const multiBox = document.getElementById('multi-rate-box-2');
            if (type === 'single') {
                singleBox.style.display = 'block';
                multiBox.style.display = 'none';
            } else {
                singleBox.style.display = 'none';
                multiBox.style.display = 'block';
            }
            calculateLoan();
        });

        // ==========================================
        // 動態多段式利率管理
        // ==========================================
        // stages: [{durationValue, durationUnit:'year'|'month', rate}, ...] (最後一段無 duration，為剩餘期數)
        let stages = [
            { durationValue: 2, durationUnit: 'year', rate: 2.0 },
            { durationValue: 1, durationUnit: 'year', rate: 2.1 },
            { durationValue: null, durationUnit: null, rate: 2.2 } // 最後剩餘段
        ];

        let stages1 = [
            { durationValue: 3, durationUnit: 'year', rate: 1.775 },
            { durationValue: null, durationUnit: null, rate: 2.275 }
        ];

        let stages2 = [
            { durationValue: 3, durationUnit: 'year', rate: 2.185 },
            { durationValue: null, durationUnit: null, rate: 2.275 }
        ];

        const MAX_STAGES = 6;

        function renderStages() {
            const list = document.getElementById('stage-list');
            if (!list) return;
            list.innerHTML = '';
            stages.forEach((stage, idx) => {
                const isLast = (idx === stages.length - 1);
                const label = `第 ${idx + 1} 段`;
                const el = document.createElement('div');
                el.className = 'stage-block';
                el.style.cssText = 'display:flex;flex-direction:column;gap:0.5rem;padding-bottom:0.6rem;border-bottom:1px solid rgba(255,255,255,0.04);margin-bottom:0.2rem;';

                // 標題行
                const titleRow = document.createElement('div');
                titleRow.className = 'stage-row-title';
                titleRow.innerHTML = `<span>${isLast ? label + '（剩餘期數）' : label}</span>`;
                if (idx > 0 && !isLast) {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'stage-remove-btn';
                    removeBtn.textContent = '移除';
                    removeBtn.onclick = (e) => { e.preventDefault(); removeStage(idx); };
                    titleRow.appendChild(removeBtn);
                } else if (isLast && stages.length > 2) {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'stage-remove-btn';
                    removeBtn.textContent = '移除此段';
                    removeBtn.onclick = (e) => { e.preventDefault(); removeStage(idx); };
                    titleRow.appendChild(removeBtn);
                }
                el.appendChild(titleRow);

                const inputRow = document.createElement('div');
                inputRow.className = 'stage-row';

                if (!isLast) {
                    // 期間輸入（含年/月切換）
                    const durationWrapper = document.createElement('div');
                    durationWrapper.className = 'input-wrapper';
                    const durationInput = document.createElement('input');
                    durationInput.type = 'number';
                    durationInput.min = '1';
                    durationInput.value = stage.durationValue || 1;
                    durationInput.placeholder = '期間';
                    durationInput.style.paddingRight = '4.8rem';
                    durationInput.oninput = (e) => {
                        stages[idx].durationValue = parseFloat(e.target.value) || 0;
                        calculateLoan();
                    };
                    const unitSel = document.createElement('div');
                    unitSel.className = 'stage-unit-selector';
                    ['year','month'].forEach(u => {
                        const btn = document.createElement('button');
                        btn.className = 'unit-btn' + (stage.durationUnit === u ? ' active' : '');
                        btn.textContent = u === 'year' ? '年' : '月';
                        btn.onclick = (e) => {
                            e.preventDefault();
                            createBurst(e.clientX, e.clientY);
                            stages[idx].durationUnit = u;

        // ==========================================
        // 數字輸入與格式化 (支援小數點，防止游標跳動)
        // ==========================================
        function formatNumberWithCommas(value) {
            if (value === null || value === undefined || value === '') return '';
            // 去除逗號與非數字字元（只保留數字與一個小數點）
            let clean = value.toString().replace(/,/g, '');
            // 只保留第一個小數點，其他的刪除
            const parts = clean.split('.');
            if (parts.length > 2) {
                clean = parts[0] + '.' + parts.slice(1).join('');
            }
            
            // 格式化整數部分
            let integerPart = parts[0];
            let decimalPart = parts[1] !== undefined ? '.' + parts[1] : '';
            
            // 整數部分加上千分位
            const num = parseInt(integerPart, 10);
            if (!isNaN(num)) {
                integerPart = num.toLocaleString('zh-TW');
            } else if (integerPart === '-') {
                integerPart = '-';
            } else if (integerPart === '') {
                integerPart = '';
            }
            
            return integerPart + decimalPart;
        }

        function parseNumberFromCommas(str) {
            if (!str) return 0;
            return parseFloat(str.replace(/,/g, '')) || 0;
        }

        // 初始化格式化輸入框
        function initFormattedInput(inputId, onInputCallback) {
            const input = document.getElementById(inputId);
            
            input.addEventListener('input', (e) => {
                let rawValue = input.value;
                if (rawValue === '') {
                    if (onInputCallback) onInputCallback('');
                    return;
                }
                
                // 記錄游標位置與原本的逗號數量
                const originalCursor = input.selectionStart;
                const originalCommaCount = (rawValue.substring(0, originalCursor).match(/,/g) || []).length;
                
                // 格式化
                const formatted = formatNumberWithCommas(rawValue);
                input.value = formatted;
                
                // 計算格式化後的游標偏移量
                const newCommaCount = (formatted.substring(0, originalCursor).match(/,/g) || []).length;
                const cursorOffset = newCommaCount - originalCommaCount;
                const newCursorPos = Math.max(0, originalCursor + cursorOffset);
                input.setSelectionRange(newCursorPos, newCursorPos);
                
                if (onInputCallback) {
                    onInputCallback(parseNumberFromCommas(formatted));
                }
            });

            // 初始化時格式化一次
            if (input.value) {
                input.value = formatNumberWithCommas(input.value);
            }
        }

        // ==========================================
        // 雙向連動邏輯 (房屋總價、自備款、自備款成數、貸款金額)
        // ==========================================
        let isSyncing = false;

        function syncInputs(changedInputId) {
            if (isSyncing) return;
            isSyncing = true;

            const totalVal = parseNumberFromCommas(document.getElementById('input-total-price').value);
            const percentVal = parseFloat(document.getElementById('input-down-payment-percent').value) || 0;
            const downVal = parseNumberFromCommas(document.getElementById('input-down-payment-amount').value);
            const loanVal = parseNumberFromCommas(document.getElementById('input-loan-amount').value);

            const totalInput = document.getElementById('input-total-price');
            const percentInput = document.getElementById('input-down-payment-percent');
            const downInput = document.getElementById('input-down-payment-amount');
            const loanInput = document.getElementById('input-loan-amount');
            const badge = document.getElementById('loan-ratio-badge');

            if (changedInputId === 'input-total-price') {
                const newDown = Math.round(totalVal * (percentVal / 100));
                const newLoan = totalVal - newDown;
                downInput.value = formatNumberWithCommas(newDown);
                loanInput.value = formatNumberWithCommas(newLoan);
            } 
            else if (changedInputId === 'input-down-payment-percent') {
                const newDown = Math.round(totalVal * (percentVal / 100));
                const newLoan = totalVal - newDown;
                downInput.value = formatNumberWithCommas(newDown);
                loanInput.value = formatNumberWithCommas(newLoan);
            } 
            else if (changedInputId === 'input-down-payment-amount') {
                let newPercent = totalVal > 0 ? (downVal / totalVal) * 100 : 0;
                newPercent = Math.round(newPercent * 100) / 100;
                percentInput.value = newPercent;
                const newLoan = Math.max(0, totalVal - downVal);
                loanInput.value = formatNumberWithCommas(newLoan);
            } 
            else if (changedInputId === 'input-loan-amount') {
                const newDown = Math.max(0, totalVal - loanVal);
                let newPercent = totalVal > 0 ? (newDown / totalVal) * 100 : 0;
                newPercent = Math.round(newPercent * 100) / 100;
                downInput.value = formatNumberWithCommas(newDown);
                percentInput.value = newPercent;
            }

            const currentTotal = parseNumberFromCommas(totalInput.value);
            const currentLoan = parseNumberFromCommas(loanInput.value);
            const ratio = currentTotal > 0 ? Math.round((currentLoan / currentTotal) * 100) : 0;
            badge.textContent = ratio + '%';

            // 組合模式金額智慧同步
            if (loanMode === 'combined') {
                const newLoanA = Math.min(currentLoan, 10000000);
                const newLoanB = Math.max(0, currentLoan - newLoanA);
                document.getElementById('input-loan-amount-1').value = formatNumberWithCommas(newLoanA);
                document.getElementById('input-loan-amount-2').value = formatNumberWithCommas(newLoanB);
            }

            isSyncing = false;
            calculateLoan();
        }

        function syncCombinedAmounts(changedInputId) {
            if (isSyncing) return;
            isSyncing = true;

            const loanTotal = parseNumberFromCommas(document.getElementById('input-loan-amount').value);
            const loanInput1 = document.getElementById('input-loan-amount-1');
            const loanInput2 = document.getElementById('input-loan-amount-2');

            let loanB = parseNumberFromCommas(loanInput2.value);

            if (changedInputId === 'input-loan-amount-1') {
                loanA = Math.min(loanA, loanTotal);
                loanB = Math.max(0, loanTotal - loanA);
                loanInput1.value = formatNumberWithCommas(loanA);
                loanInput2.value = formatNumberWithCommas(loanB);
            } else if (changedInputId === 'input-loan-amount-2') {
                loanB = Math.min(loanB, loanTotal);
                loanA = Math.max(0, loanTotal - loanB);

        function setLoanAValue(val) {

        // ==========================================
        // 房貸計算核心與圖表渲染
        // ==========================================
        let chartInstance = null;

        // 二分搜尋法求解 IRR 進而得到實質年利率 (APR)
        // 使得 (貸款本金 - 開辦費用) = 每期付款折現的總和
        function calculateAPR(loanAmount, fee, payments) {
            const netAmount = loanAmount - fee;
            if (netAmount <= 0) return 0;

            let low = 0;
            let high = 2; // 月利率上限 200% (極端防呆)
            let mid = 0;

            for (let iter = 0; iter < 80; iter++) {
                mid = (low + high) / 2;
                let npv = -netAmount;
                for (let t = 0; t < payments.length; t++) {
                    npv += payments[t] / Math.pow(1 + mid, t + 1);
                }

                if (npv > 0) {
                    low = mid;
                } else {
                    high = mid;
                }
            }

            return mid * 12 * 100; // APR
        }

        function calculateSingleLoanDetail(loanAmount, periodVal, periodUnit, graceVal, graceUnit, rateType, singleRate, stageList, repayType) {
            const totalMonths = Math.max(0, periodUnit === 'year' ? Math.round(periodVal * 12) : Math.round(periodVal));
            let graceMonths = Math.max(0, graceUnit === 'year' ? Math.round(graceVal * 12) : Math.round(graceVal));
            if (graceMonths > totalMonths) graceMonths = totalMonths;

            let stageRates = [];
            if (rateType === 'single') {
                for (let k = 0; k < totalMonths; k++) stageRates.push(singleRate);
            } else {
                let consumed = 0;
                for (let si = 0; si < stageList.length - 1; si++) {
                    const s = stageList[si];
                    const sMonths = s.durationUnit === 'year'
                        ? Math.round((s.durationValue || 0) * 12)
                        : Math.round(s.durationValue || 0);
                    for (let k = 0; k < sMonths; k++) {
                        stageRates.push(s.rate || 0);
                    }
                    consumed += sMonths;
                }
                const lastRate = stageList[stageList.length - 1].rate || 0;
                for (let k = consumed; k < totalMonths; k++) {
                    stageRates.push(lastRate);
                }
            }

            const resultData = [];
            const paymentArray = [];
            let totalInterest = 0;

            // 期數 0 初始狀態
            resultData.push({
                period: 0,
                startBalance: 0,
                principalPaid: 0,
                interestPaid: 0,
                totalPayment: 0,
                endBalance: loanAmount
            });

            if (totalMonths > 0 && loanAmount > 0) {
                let remainingBalance = loanAmount;
                const graceBal = loanAmount;
                const repayMonths = totalMonths - graceMonths;
                const principalPerMonth = repayMonths > 0 ? (graceBal / repayMonths) : 0;

                for (let m = 1; m <= totalMonths; m++) {
                    const startBal = remainingBalance;
                    const currentAnnualRate = (stageRates[m - 1] !== undefined ? stageRates[m - 1] : 0);
                    const r_m = (currentAnnualRate / 100) / 12;

                    let principalPaid = 0;
                    let interestPaid = 0;
                    let totalPayment = 0;

                    if (m <= graceMonths) {
                        interestPaid = startBal * r_m;
                        principalPaid = 0;
                        totalPayment = interestPaid;
                        remainingBalance = startBal;
                    } else {
                        const activeRepayMonthsLeft = totalMonths - m + 1;
                        if (repayType === 'equal-total') {
                            if (r_m === 0) {
                                totalPayment = startBal / activeRepayMonthsLeft;
                            } else {
                                totalPayment = startBal * (r_m * Math.pow(1 + r_m, activeRepayMonthsLeft)) / (Math.pow(1 + r_m, activeRepayMonthsLeft) - 1);
                            }
                            interestPaid = startBal * r_m;
                            principalPaid = totalPayment - interestPaid;
                            remainingBalance = startBal - principalPaid;
                        } else {
                            principalPaid = principalPerMonth;
                            interestPaid = startBal * r_m;
                            totalPayment = principalPaid + interestPaid;
                            remainingBalance = startBal - principalPaid;
                        }
                    }

                    if (m === totalMonths) {
                        remainingBalance = 0;
                        principalPaid = startBal;
                        totalPayment = principalPaid + interestPaid;
                    }

                    totalInterest += interestPaid;
                    paymentArray.push(totalPayment);

                    resultData.push({
                        period: m,
                        startBalance: startBal,
                        principalPaid: principalPaid,
                        interestPaid: interestPaid,
                        totalPayment: totalPayment,
                        endBalance: Math.max(0, remainingBalance)
                    });
                }
            }

            return {
                totalMonths: totalMonths,
                graceMonths: graceMonths,
                totalInterest: totalInterest,
                paymentArray: paymentArray,
                resultData: resultData
            };
        }

        function calculateLoan() {
            if (loanMode === 'single') {
                const loanAmount = parseNumberFromCommas(document.getElementById('input-loan-amount').value);
                const periodVal = parseFloat(document.getElementById('input-period').value) || 0;
                const graceVal = parseFloat(document.getElementById('input-grace-period').value) || 0;
                const fee = parseNumberFromCommas(document.getElementById('input-fee').value);
                const singleRate = parseFloat(document.getElementById('input-single-rate').value) || 0;

                const detail = calculateSingleLoanDetail(
                    loanAmount, periodVal, periodUnit, graceVal, graceUnit, rateType, singleRate, stages, repayType
                );

                renderResults(loanAmount, fee, detail.totalMonths, detail.graceMonths, detail.totalInterest, detail.paymentArray, detail.resultData);
            } else {
                const totalAmount = parseNumberFromCommas(document.getElementById('input-loan-amount').value);
                
                // 貸款 A
                const loanAmount1 = parseNumberFromCommas(document.getElementById('input-loan-amount-1').value);
                const periodVal1 = parseFloat(document.getElementById('input-period-1').value) || 0;
                const graceVal1 = parseFloat(document.getElementById('input-grace-period-1').value) || 0;
                const singleRate1 = parseFloat(document.getElementById('input-single-rate-1').value) || 0;
                const fee1 = parseNumberFromCommas(document.getElementById('input-fee-1').value);

                // 貸款 B
                const loanAmount2 = parseNumberFromCommas(document.getElementById('input-loan-amount-2').value);
                const periodVal2 = parseFloat(document.getElementById('input-period-2').value) || 0;
                const graceVal2 = parseFloat(document.getElementById('input-grace-period-2').value) || 0;
                const singleRate2 = parseFloat(document.getElementById('input-single-rate-2').value) || 0;
                const fee2 = parseNumberFromCommas(document.getElementById('input-fee-2').value);

                const detail1 = calculateSingleLoanDetail(
                    loanAmount1, periodVal1, periodUnit1, graceVal1, graceUnit1, rateType1, singleRate1, stages1, repayType1
                );
                const detail2 = calculateSingleLoanDetail(
                    loanAmount2, periodVal2, periodUnit2, graceVal2, graceUnit2, rateType2, singleRate2, stages2, repayType2
                );

                const maxMonths = Math.max(detail1.totalMonths, detail2.totalMonths);
                const combinedResultData = [];
                const combinedPaymentArray = [];
                let combinedTotalInterest = 0;

                // 第 0 期
                combinedResultData.push({
                    period: 0,
                    startBalance: 0,
                    principalPaid: 0,
                    interestPaid: 0,
                    totalPayment: 0,
                    endBalance: loanAmount1 + loanAmount2,
                    detail1: detail1.resultData[0],
                    detail2: detail2.resultData[0]
                });

                for (let m = 1; m <= maxMonths; m++) {
                    const item1 = detail1.resultData[m] || {
                        period: m, startBalance: 0, principalPaid: 0, interestPaid: 0, totalPayment: 0, endBalance: 0
                    };
                    const item2 = detail2.resultData[m] || {
                        period: m, startBalance: 0, principalPaid: 0, interestPaid: 0, totalPayment: 0, endBalance: 0
                    };

                    const totalPayment = item1.totalPayment + item2.totalPayment;
                    const interestPaid = item1.interestPaid + item2.interestPaid;

                    combinedTotalInterest += interestPaid;
                    combinedPaymentArray.push(totalPayment);

                    combinedResultData.push({
                        period: m,
                        startBalance: item1.startBalance + item2.startBalance,
                        principalPaid: item1.principalPaid + item2.principalPaid,
                        interestPaid: interestPaid,
                        totalPayment: totalPayment,
                        endBalance: item1.endBalance + item2.endBalance,
                        detail1: item1,
                        detail2: item2
                    });
                }

                const inGrace = (detail1.resultData[1] && detail1.resultData[1].principalPaid === 0 && loanAmount1 > 0) ||
                                (detail2.resultData[1] && detail2.resultData[1].principalPaid === 0 && loanAmount2 > 0);

                renderResults(totalAmount, fee1 + fee2, maxMonths, inGrace ? 1 : 0, combinedTotalInterest, combinedPaymentArray, combinedResultData, true);
            }
        }

        function renderResults(loanAmount, fee, totalMonths, graceMonths, totalInterest, paymentArray, resultData, isCombined = false) {
            const totalRepay = loanAmount + totalInterest;

            let name1 = '貸款 A';
            let name2 = '貸款 B';
            if (isCombined) {
                const el1 = document.getElementById('input-loan-name-1');
                const el2 = document.getElementById('input-loan-name-2');
                if (el1 && el1.value.trim()) name1 = el1.value.trim();
                if (el2 && el2.value.trim()) name2 = el2.value.trim();
            }

            let apr = 0;
            if (loanAmount > 0 && totalMonths > 0) {
                apr = calculateAPR(loanAmount, fee, paymentArray);
            }
            document.getElementById('val-apr').textContent = apr.toFixed(2) + ' %';

            const firstPayment = paymentArray[0] || 0;
            document.getElementById('val-monthly').textContent = Math.round(firstPayment).toLocaleString('zh-TW') + ' 元';
            document.getElementById('val-interest').textContent = Math.round(totalInterest).toLocaleString('zh-TW') + ' 元';
            document.getElementById('val-total').textContent = Math.round(totalRepay).toLocaleString('zh-TW') + ' 元';

            const monthlyTitle = document.getElementById('monthly-payment-title');
            if (isCombined) {
                if (graceMonths > 0) {
                    monthlyTitle.innerHTML = `首期每月還款額 <span class="badge" style="margin-left: 0; background: rgba(0,245,160,0.15)">含寬限期</span>`;
                } else {
                    monthlyTitle.textContent = '首期每月還款額';
                }
            } else {
                if (graceMonths > 0) {
                    monthlyTitle.innerHTML = `首期每月還款額 <span class="badge" style="margin-left: 0; background: rgba(0,245,160,0.15)">寬限期內</span>`;
                } else {
                    monthlyTitle.textContent = '首期每月還款額';
                }
            }

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            resultData.forEach(item => {
                const tr = document.createElement('tr');
                const isInitial = item.period === 0;

                if (isInitial) {
                    tr.innerHTML = `
                        <td style="text-align: left; color: var(--text-secondary);">初始</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td style="color: #00f5a0; font-weight: 500;">${Math.round(item.endBalance).toLocaleString('zh-TW')} 元</td>
                    `;

            const n = parseFloat(val);
            return (isFinite(n) && !isNaN(n)) ? n : fallback;
        }

                const rpParam = params.get('rp');

                if (guParam === 'year' || guParam === 'month') graceUnit = guParam;

                container.querySelectorAll('.unit-btn').forEach(btn => {

                    btn.parentNode.replaceChild(fresh, btn);

                    const currentB = parseNumberFromCommas(loanInput2.value);

                        const newLoanA = Math.min(loanTotal, 10000000);
                        const newLoanB = Math.max(0, loanTotal - newLoanA);
                        loanInput1.value = formatNumberWithCommas(newLoanA);

                    singleBox.style.display = 'block';
                    multiBox.style.display  = 'none';
                } else {
                    singleBox.style.display = 'none';
                    multiBox.style.display  = 'block';
                }
                calculateLoan();
            });

            // 執行首次計算
            calculateLoan();
        });
    </script>

    <script>
        // ==========================================
        // 互動式 Canvas 霓虹紫粒子背景
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            adjustParticles();
        }

        class Particle {
            constructor(x = null, y = null, isBurst = false) {
                this.x = x !== null ? x : Math.random() * canvas.width;
                this.y = y !== null ? y : Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5; 
                this.density = (Math.random() * 30) + 1;
                
                this.isBurst = isBurst;
                this.life = isBurst ? 1.0 : -1; 
                
                if (isBurst) {
                    this.velocityX = (Math.random() - 0.5) * 5; 
                    this.velocityY = (Math.random() - 0.5) * 5;
                } else {
                    this.velocityY = -((Math.random() * 0.35) + 0.1); // 紫色氣泡微粒子緩緩向上飄
                    this.velocityX = (Math.random() - 0.5) * 0.2;
                }
            }
            draw() {
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.closePath();
                
                let alpha = this.isBurst ? this.life : this.size / 3.5;
                
                // 霓虹綠發光粒子
                ctx.fillStyle = this.isBurst 
                    ? `rgba(0, 245, 160, ${alpha})` 
                    : `rgba(0, 245, 160, ${alpha * 0.75})`; 
                ctx.fill();
            }
            update() {
                if (this.isBurst) {
                    this.x += this.velocityX;
                    this.y += this.velocityY;
                    this.life -= 0.025; 
                    this.velocityX *= 0.95;
                    this.velocityY *= 0.95;
                } else {
                    this.y += this.velocityY;
                    this.x += this.velocityX;
                    
                    if (this.y < 0) {
                        this.y = canvas.height;
                        this.x = Math.random() * canvas.width;
                    }
                }
            }
        }

        function adjustParticles() {
            particles = [];
            const numberOfParticles = Math.min(65, (canvas.width * canvas.height) / 25000);
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function createBurst(x, y) {
            if (x === undefined || y === undefined) return;
            const burstCount = 15;
            for (let i = 0; i < burstCount; i++) {
                particles.push(new Particle(x, y, true));
            }
        }

        function initParticles() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 監聽滑鼠移動
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.x;
                mouse.y = e.y;
            });
            window.addEventListener('mouseout', () => {
                mouse.x = null;
                mouse.y = null;
            });

            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                if (particles[i].isBurst && particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('load', initParticles);
    </script>
</body>
</html>
