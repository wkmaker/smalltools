<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股期貨槓桿與逆風點數估算器</title>
    <link rel="icon" href="https://tools.cjkuo.net/support.svg" type="image/svg+xml">
    <meta name="description" content="專業的台指期 (大台/小台/微台) 槓桿與維持率計算器。支援多空部位切換、實質資金槓桿試算、逆風壓力模擬滑桿、風險指標 SVG 儀表板與保證金回補試算。">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="台股期貨槓桿與逆風點數估算器">
    <meta property="og:description" content="期貨交易者的風控警示器。即時模擬大盤逆風、實質資金槓桿、追繳與斷頭臨界點試算。">
    <meta property="og:url" content="https://tools.cjkuo.net/futures-calculator/index.html">
    <meta property="og:image" content="https://tools.cjkuo.net/support.svg">

    <!-- 引入 Google Fonts & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #030305;
            --glass-bg: rgba(255, 255, 255, 0.015);
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent-glow: rgba(255, 59, 48, 0.6); /* 警示紅 */
            --accent-glow-rgb: 255, 59, 48;
            --accent-color: #ff3b30;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --card-bg: rgba(255, 255, 255, 0.01);
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1rem;
        }

        /* Canvas 背景 */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .glass-container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.01);
            width: 100%;
            max-width: 90%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 返回按鈕 */
        .back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            z-index: 11;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            color: var(--accent-color);
            border-color: rgba(255, 59, 48, 0.3);
            background: rgba(255, 59, 48, 0.05);
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.15);
        }

        .back-btn:hover svg {
            transform: translateX(-3px);
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
            margin-top: 1rem;
        }

        h1 {
            font-weight: 300;
            font-size: 2.2rem;
            letter-spacing: 4px;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            box-shadow: 0 0 8px var(--accent-color);
            margin: 0.8rem auto 0;
            animation: glow-pulse 3s infinite ease-in-out;
        }

        .subtitle-top {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 1px var(--accent-color)); }
            50% { opacity: 1; filter: drop-shadow(0 0 6px var(--accent-color)); }
        }

        /* 雙欄排版 */
        .app-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 2.5rem;
            align-items: start;
        }

        .pane {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .pane:hover, .pane:focus-within {
            border-color: rgba(255, 59, 48, 0.2);
            box-shadow: 0 0 25px rgba(255, 59, 48, 0.03);
        }

        .pane-title {
            font-size: 1.25rem;
            font-weight: 500;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.8rem;
            letter-spacing: 1px;
        }

        .pane-title-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .pane-title-left svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-color);
        }

        /* 多空方向切換 Tab */
        .dir-toggle-container {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.2rem;
            width: 100%;
        }

        .dir-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.5rem 0;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .dir-btn.active.long {
            background: rgba(0, 255, 102, 0.15);
            color: #00ff66;
            border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .dir-btn.active.short {
            background: rgba(255, 59, 48, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(255, 59, 48, 0.3);
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.1);
        }

        /* 輸入表單 */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-label span.note {
            font-size: 0.75rem;
            color: var(--accent-color);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 1rem;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .styled-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            padding: 0.8rem 0;
            font-size: 1.1rem;
            font-weight: 500;
            width: 100%;
        }

        .styled-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .input-addon {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            padding-left: 0.5rem;
            flex-shrink: 0;
        }

        /* 雙欄輸入排版 */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* 按鈕樣式 */
        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 59, 48, 0.08);
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.15);
        }

        .btn-micro {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        /* ====== SVG 儀表板區域 ====== */
        .gauge-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gauge-svg {
            width: 100%;
            max-width: 320px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        .gauge-needle {
            transform-origin: 100px 90px;
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .gauge-value-text {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: -1.2rem;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .gauge-status-label {
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: 700;
            margin-top: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 儀表板狀態樣式 */
        .status-safe {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: #00ff66;
            box-shadow: 0 0 10px rgba(0,255,102,0.1);
        }

        .status-warn {
            background: rgba(255, 184, 0, 0.1);
            border: 1px solid rgba(255, 184, 0, 0.3);
            color: #ffb800;
            box-shadow: 0 0 10px rgba(255,184,0,0.1);
        }

        .status-danger {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255,59,48,0.1);
            animation: danger-pulse 1.5s infinite;
        }

        @keyframes danger-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; box-shadow: 0 0 15px rgba(255,59,48,0.35); }
        }

        /* 壓力測試滑桿區 */
        .stress-test-box {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .stress-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .stress-drop-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 8px rgba(255, 59, 48, 0.3);
        }

        /* 漂亮的紅色滑桿 */
        .range-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
            border: 2px solid #ffffff;
            transition: transform 0.1s ease;
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 雙欄臨界點排版 */
        .critical-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .critical-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 輸出資訊卡片 */
        .output-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .output-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .output-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .output-val {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
        }

        .output-subval {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* 回補警示板 */
        .topup-box {
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(255,255,255,0.005);
        }

        .topup-box.warning-active {
            border-color: rgba(255, 59, 48, 0.25);
            background: rgba(255, 59, 48, 0.02);
        }

        .topup-title {
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .topup-methods {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .topup-method-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .topup-method-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .topup-method-val {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
        }

        /* 修正下拉選單樣式，確保選單展開時有深色背景與亮白色文字，防止文字消失 */
        select {
            background-color: #121218 !important;
            color: #ffffff !important;
        }

        option {
            background-color: #121218 !important;
            color: #ffffff !important;
            padding: 0.5rem;
        }

        .select-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .select-addon {
            background: #121218;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        /* 複製成功 Toast 提示 */
        .toast-notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(6, 6, 9, 0.9);
            border: 1px solid var(--accent-color);
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(255, 59, 48, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-notification svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-color);
        }

        /* ====== 響應式媒體查詢 ====== */
        @media (max-width: 1100px) {
            .app-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        @media (max-width: 900px) {
            .glass-container {
                max-width: 95%;
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .back-btn {
                position: static;
                display: inline-flex;
                margin-bottom: 1.5rem;
                align-self: flex-start;
            }

            .glass-container {
                padding: 1.5rem 1rem;
                display: flex;
                flex-direction: column;
            }

            .header-section {
                margin-top: 0;
                margin-bottom: 1.5rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            .pane {
                padding: 1.2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 粒子背景 Canvas -->
    <canvas id="particle-canvas"></canvas>

    <div class="glass-container">
        <!-- 返回按鈕 -->
        <a href="../index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            回工具庫首頁
        </a>

        <!-- 標題 -->
        <div class="header-section">
            <h1>台股期貨槓桿與逆風點數估算器</h1>
            <div class="subtitle-top">Futures Margin & Leverage Calculator</div>
        </div>

        <!-- 主要雙欄應用區域 -->
        <div class="app-grid">
            
            <!-- 左欄：部位與本金設定 -->
            <div class="pane">
                <div class="pane-title">
                    <div class="pane-title-left">
                        <svg viewBox="0 0 24 24"><path d="M3 17h18v2H3zm0-7h18v5H3zm0-4h18v2H3z"/></svg>
                        合約與部位設定
                    </div>
                </div>

                <!-- 合約選擇 -->
                <div class="form-group">
                    <label class="form-label" for="contract-type">期貨契約種類</label>
                    <div class="input-wrapper">
                        <select id="contract-type" class="styled-input" style="background: transparent; border: none; cursor:pointer;">
                            <option value="mxf" selected>🇹🇼 微型台指期 (MXF) - 每點 $10 元</option>
                            <option value="mtx">🇹🇼 小型台指期 (MTX) - 每點 $50 元</option>
                            <option value="tx">🇹🇼 台指期 (TX / 大台) - 每點 $200 元</option>
                            <option value="custom">⚙️ 自訂契約 (可指定每點價值)</option>
                        </select>
                    </div>
                </div>

                <!-- 自訂點值輸入框 (預設隱藏) -->
                <div class="form-group" id="custom-point-val-group" style="display: none;">
                    <label class="form-label" for="custom-point-value">自訂契約每點價值</label>
                    <div class="input-wrapper">
                        <input type="number" id="custom-point-value" class="styled-input" placeholder="例如：10" value="10" min="0.1" step="any">
                        <span class="input-addon">元 / 點</span>
                    </div>
                </div>

                <!-- 多空方向 Tab -->
                <div class="form-group">
                    <label class="form-label">部位交易方向</label>
                    <div class="dir-toggle-container">
                        <button class="dir-btn active long" id="dir-long-btn">📈 買進多單 (Long)</button>
                        <button class="dir-btn short" id="dir-short-btn">📉 賣出空單 (Short)</button>
                    </div>
                </div>

                <!-- 指數與口數雙欄 -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="index-price">當前大盤/期貨指數</label>
                        <div class="input-wrapper">
                            <input type="number" id="index-price" class="styled-input" placeholder="例如：23000" min="0" step="any">
                            <span class="input-addon">點</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="position-qty">操作口數</label>
                        <div class="input-wrapper">
                            <input type="number" id="position-qty" class="styled-input" placeholder="例如：1" min="1" step="1">
                            <span class="input-addon">口</span>
                        </div>
                    </div>
                </div>

                <!-- 投入本金 -->
                <div class="form-group">
                    <label class="form-label" for="capital-amount">
                        投入保證金本金
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="capital-amount" class="styled-input" placeholder="例如：100,000">
                        <span class="input-addon">元</span>
                    </div>
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.2rem;">
                        <button class="btn btn-micro" id="cap-preset-1" style="flex:1;">投入 1.5 倍原始保證金</button>
                        <button class="btn btn-micro" id="cap-preset-2" style="flex:1;">投入 2.0 倍原始保證金</button>
                    </div>
                </div>

                <!-- 保證金標準自訂 -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="margin-init">單口原始保證金</label>
                        <div class="input-wrapper">
                            <input type="text" id="margin-init" class="styled-input" placeholder="12,000">
                            <span class="input-addon">元</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="margin-maint">單口維持保證金</label>
                        <div class="input-wrapper">
                            <input type="text" id="margin-maint" class="styled-input" placeholder="9,200">
                            <span class="input-addon">元</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右欄：儀表板與逆風壓力分析 -->
            <div class="pane">
                <div class="pane-title">
                    <div class="pane-title-left">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                        風控指標與實質槓桿
                    </div>
                </div>

                <!-- 1. SVG 風險指標儀表板 -->
                <div class="gauge-section">
                    <svg class="gauge-svg" viewBox="0 0 200 110">
                        <!-- 背景弧線 -->
                        <path d="M 30,90 A 70,70 0 0,1 170,90" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12" stroke-linecap="round"/>
                        <!-- 斷頭區 (0% - 25%) 弧度約占 1/8 -->
                        <path d="M 30,90 A 70,70 0 0,1 35.33,63.21" fill="none" stroke="#ff3b30" stroke-width="12" stroke-linecap="butt"/>
                        <!-- 警告追繳區 (25% - 100%) -->
                        <path d="M 35.33,63.21 A 70,70 0 0,1 100,20" fill="none" stroke="#ffb800" stroke-width="12" stroke-linecap="butt"/>
                        <!-- 安全原始保證金區 (100% - 200% 以上) -->
                        <path d="M 100,20 A 70,70 0 0,1 170,90" fill="none" stroke="#00ff66" stroke-width="12" stroke-linecap="round"/>
                        
                        <!-- 儀表板指針 -->
                        <line x1="100" y1="90" x2="100" y2="35" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" id="gauge-needle" class="gauge-needle"/>
                        <!-- 中心圓點 -->
                        <circle cx="100" cy="90" r="7" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
                    </svg>
                    <div class="gauge-value-text" id="gauge-ratio">- %</div>
                    <div class="gauge-status-label" id="gauge-status">-</div>
                </div>

                <!-- 實質資金槓桿卡片 -->
                <div class="output-card">
                    <div class="output-info">
                        <span class="output-label">當前實質資金槓桿</span>
                        <span class="output-val" id="out-real-leverage" style="color: #ff3b30; font-size: 1.3rem;">- 倍</span>
                        <span class="output-subval">部位總市值: <span id="out-contract-val">-</span></span>
                    </div>
                </div>

                <!-- 2. 壓力測試滑桿 -->
                <div class="stress-test-box">
                    <div class="stress-label-row">
                        <span>模擬逆風波段 (<span id="stress-dir-label">下跌</span>)</span>
                        <span class="stress-drop-value" id="stress-drop-pct">0.0% <span style="font-size:0.8rem; font-weight:normal; opacity:0.7;">(折合 0 點)</span></span>
                    </div>
                    <input type="range" id="stress-slider" class="range-slider" min="0" max="60" value="0" step="0.1">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: 0.4rem;">
                        <div class="output-card" style="padding: 0.6rem 0.8rem;">
                            <div class="output-info">
                                <span class="output-label">模擬指數</span>
                                <span class="output-val" id="sim-index" style="font-size: 1rem;">-</span>
                            </div>
                        </div>
                        <div class="output-card" style="padding: 0.6rem 0.8rem;">
                            <div class="output-info">
                                <span class="output-label">預估權益數 (P&L)</span>
                                <span class="output-val" id="sim-capital" style="font-size: 1rem;">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. 臨界點資訊 -->
                <div class="critical-grid">
                    <div class="output-card" style="cursor: pointer;" title="點擊複製此數值">
                        <div class="output-info">
                            <span class="output-label">追繳警示點 (維持保證金)</span>
                            <span class="output-val" id="out-warn-index" style="color: #ffb800; font-size: 1.1rem;">- 點</span>
                            <span class="output-subval">容許逆風: <span id="out-warn-drop" style="color: #ffb800; font-weight:700;">- 點</span></span>
                        </div>
                    </div>
                    <div class="output-card" style="cursor: pointer;" title="點擊複製此數值">
                        <div class="output-info">
                            <span class="output-label">強制平倉點 (風險指標 25%)</span>
                            <span class="output-val" id="out-liquidation-index" style="color: #ff3b30; font-size: 1.1rem;">- 點</span>
                            <span class="output-subval">容許逆風: <span id="out-liquidation-drop" style="color: #ff3b30; font-weight:700;">- 點</span></span>
                        </div>
                    </div>
                </div>

                <!-- 4. 保證金補繳試算 -->
                <div class="topup-box" id="topup-box">
                    <div class="topup-title" id="topup-title">
                        <span>保證金回補試算</span>
                    </div>
                    <div class="topup-methods">
                        <div class="topup-method-card">
                            <span class="topup-method-title">需補足至原始保證金之現金</span>
                            <span class="topup-method-val" id="topup-cash">-</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 成功提示 Notification -->
    <div id="toast" class="toast-notification">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span id="toast-text">已複製</span>
    </div>

    <script>
        // ==========================================
        // 1. 紅色粒子背景 Canvas
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            adjustParticles();
        }

        class Particle {
            constructor(x = null, y = null, isBurst = false) {
                this.x = x !== null ? x : Math.random() * canvas.width;
                this.y = y !== null ? y : Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.density = (Math.random() * 30) + 1;
                this.isBurst = isBurst;
                this.life = isBurst ? 1.0 : -1;

                if (isBurst) {
                    this.velocityX = (Math.random() - 0.5) * 5;
                    this.velocityY = (Math.random() - 0.5) * 5;
                } else {
                    this.velocityY = -((Math.random() * 0.4) + 0.1); // 緩慢向上漂浮
                    this.velocityX = (Math.random() - 0.5) * 0.2;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                let alpha = this.isBurst ? this.life : this.size / 3.5;
                ctx.fillStyle = this.isBurst 
                    ? `rgba(255, 59, 48, ${alpha})` 
                    : `rgba(255, 59, 48, ${alpha * 0.7})`;
                ctx.fill();
            }
            update() {
                if (this.isBurst) {
                    this.x += this.velocityX;
                    this.y += this.velocityY;
                    this.life -= 0.025;
                    this.velocityX *= 0.95;
                    this.velocityY *= 0.95;
                } else {
                    this.y += this.velocityY;
                    this.x += this.velocityX;

                    if (this.y < 0) {
                        this.y = canvas.height;
                        this.x = Math.random() * canvas.width;
                    }
                    if (this.x < 0 || this.x > canvas.width) {
                        this.x = Math.random() * canvas.width;
                    }
                }

                // 滑鼠引力
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (mouse.x !== null && distance < mouse.radius) {
                    let force = (mouse.radius - distance) / mouse.radius;
                    this.x -= (dx / distance) * force * this.density * 0.5;
                    this.y -= (dy / distance) * force * this.density * 0.5;
                }
            }
        }

        function adjustParticles() {
            const targetCount = Math.floor((canvas.width * canvas.height) / 12000);
            let bgParticles = particles.filter(p => !p.isBurst);
            const burstParticles = particles.filter(p => p.isBurst);

            bgParticles.forEach(p => {
                if (p.x > canvas.width) p.x = Math.random() * canvas.width;
                if (p.y > canvas.height) p.y = Math.random() * canvas.height;
            });

            if (bgParticles.length < targetCount) {
                const toAdd = targetCount - bgParticles.length;
                for (let i = 0; i < toAdd; i++) {
                    bgParticles.push(new Particle());
                }
            } else if (bgParticles.length > targetCount) {
                bgParticles = bgParticles.slice(0, targetCount);
            }
            particles = [...bgParticles, ...burstParticles];
        }

        function createBurst(x, y) {
            for(let i = 0; i < 18; i++) {
                particles.push(new Particle(x, y, true));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.isBurst && p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', (e) => {
            mouse.radius = 250;
            createBurst(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => { mouse.radius = 150; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        document.querySelectorAll('input, select, button, a').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.pageX) {
                    createBurst(e.clientX, e.clientY);
                }
            });
        });

        animateParticles();


        // ==========================================
        // 2. 期貨計算核心邏輯
        // ==========================================
        const contractTypeSelect = document.getElementById('contract-type');
        const customPointValGroup = document.getElementById('custom-point-val-group');
        const customPointValueIn = document.getElementById('custom-point-value');
        const dirLongBtn = document.getElementById('dir-long-btn');
        const dirShortBtn = document.getElementById('dir-short-btn');

        const indexPriceIn = document.getElementById('index-price');
        const positionQtyIn = document.getElementById('position-qty');
        const capitalAmountIn = document.getElementById('capital-amount');
        const marginInitIn = document.getElementById('margin-init');
        const marginMaintIn = document.getElementById('margin-maint');

        const outRealLeverage = document.getElementById('out-real-leverage');
        const outContractVal = document.getElementById('out-contract-val');

        const stressSlider = document.getElementById('stress-slider');
        const stressDropPct = document.getElementById('stress-drop-pct');
        const stressDirLabel = document.getElementById('stress-dir-label');
        const simIndexEl = document.getElementById('sim-index');
        const simCapitalEl = document.getElementById('sim-capital');

        const outWarnIndex = document.getElementById('out-warn-index');
        const outWarnDrop = document.getElementById('out-warn-drop');
        const outLiquidationIndex = document.getElementById('out-liquidation-index');
        const outLiquidationDrop = document.getElementById('out-liquidation-drop');

        const gaugeRatio = document.getElementById('gauge-ratio');
        const gaugeStatus = document.getElementById('gauge-status');
        const gaugeNeedle = document.getElementById('gauge-needle');

        const topupBox = document.getElementById('topup-box');
        const topupTitle = document.getElementById('topup-title');
        const topupCash = document.getElementById('topup-cash');

        const capPreset1Btn = document.getElementById('cap-preset-1');
        const capPreset2Btn = document.getElementById('cap-preset-2');

        let isCalculating = false;
        let positionDirection = "long"; // "long" 多單, "short" 空單

        // 取得每點點值
        function getPointValue() {
            const contract = contractTypeSelect.value;
            if (contract === 'tx') return 200;
            if (contract === 'mtx') return 50;
            if (contract === 'custom') {
                return parseFloat(customPointValueIn.value) || 0;
            }
            return 10; // mxf
        }

        // 當合約種類變更時，自動更新預設保證金標準
        function updateDefaultMargins() {
            const contract = contractTypeSelect.value;
            if (contract === 'tx') {
                marginInitIn.value = "636,000";
                marginMaintIn.value = "488,000";
                customPointValGroup.style.display = "none";
            } else if (contract === 'mtx') {
                marginInitIn.value = "159,000";
                marginMaintIn.value = "122,000";
                customPointValGroup.style.display = "none";
            } else if (contract === 'mxf') {
                marginInitIn.value = "31,800";
                marginMaintIn.value = "24,400";
                customPointValGroup.style.display = "none";
            } else {
                // custom 自訂
                customPointValGroup.style.display = "block";
            }
        }

        function recalculate() {
            if (isCalculating) return;
            isCalculating = true;

            const indexPrice = parseFloat(indexPriceIn.value) || 0;
            const qty = parseFloat(positionQtyIn.value) || 0;
            const capital = parseFloat(capitalAmountIn.value.replace(/,/g, '')) || 0;
            
            const pointVal = getPointValue();
            const contractValue = indexPrice * qty * pointVal;

            const singleInit = parseFloat(marginInitIn.value.replace(/,/g, '')) || 0;
            const singleMaint = parseFloat(marginMaintIn.value.replace(/,/g, '')) || 0;

            const totalInit = singleInit * qty;
            const totalMaint = singleMaint * qty;

            // 1. 實質槓桿與市值
            outContractVal.innerText = `$${Math.round(contractValue).toLocaleString()} 元`;
            if (capital > 0) {
                const realLev = contractValue / capital;
                outRealLeverage.innerText = `${realLev.toFixed(2)} 倍`;
            } else {
                outRealLeverage.innerText = '- 倍';
            }

            // 2. 臨界點試算
            if (capital > 0 && qty > 0) {
                // A. 追繳臨界點：權益數 = 總維持保證金
                const warnDropPoints = (capital - totalMaint) / (qty * pointVal);
                let warnIndex = 0;
                if (positionDirection === 'long') {
                    warnIndex = indexPrice - warnDropPoints;
                } else {
                    warnIndex = indexPrice + warnDropPoints;
                }

                outWarnIndex.innerText = `${warnIndex > 0 ? Math.round(warnIndex).toLocaleString() : 0} 點`;
                outWarnDrop.innerText = warnDropPoints > 0 ? `${Math.round(warnDropPoints).toLocaleString()} 點` : '0 點';

                // B. 強制平倉點：風險指標 = 25% (權益數 = 總原始保證金 * 0.25)
                const liqDropPoints = (capital - (totalInit * 0.25)) / (qty * pointVal);
                let liqIndex = 0;
                if (positionDirection === 'long') {
                    liqIndex = indexPrice - liqDropPoints;
                } else {
                    liqIndex = indexPrice + liqDropPoints;
                }

                outLiquidationIndex.innerText = `${liqIndex > 0 ? Math.round(liqIndex).toLocaleString() : 0} 點`;
                outLiquidationDrop.innerText = liqDropPoints > 0 ? `${Math.round(liqDropPoints).toLocaleString()} 點` : '0 點';
            } else {
                outWarnIndex.innerText = '- 點';
                outWarnDrop.innerText = '- 點';
                outLiquidationIndex.innerText = '- 點';
                outLiquidationDrop.innerText = '- 點';
            }

            // 3. 模擬壓力測試計算 (從百分比換算為點數)
            const dropPct = parseFloat(stressSlider.value) || 0;
            const dropPoints = indexPrice * (dropPct / 100);
            
            stressDropPct.innerHTML = `${dropPct.toFixed(1)}% <span style="font-size:0.8rem; font-weight:normal; opacity:0.7;">(折合 ${Math.round(dropPoints).toLocaleString()} 點)</span>`;
            stressDirLabel.innerText = positionDirection === 'long' ? '下跌' : '上漲';

            // 模擬指數
            let simIndex = 0;
            if (positionDirection === 'long') {
                simIndex = indexPrice - dropPoints;
            } else {
                simIndex = indexPrice + dropPoints;
            }
            simIndexEl.innerText = indexPrice > 0 ? `${Math.round(simIndex).toLocaleString()} 點` : '-';

            // 模擬損益與權益數
            // 多單下跌虧損，空單上漲虧損
            const simLoss = dropPoints * qty * pointVal;
            const simCapital = capital - simLoss;
            simCapitalEl.innerText = capital > 0 ? `$${Math.round(simCapital).toLocaleString()} 元 (損益: -$${Math.round(simLoss).toLocaleString()})` : '-';

            // 4. 計算與更新風險指標 SVG 儀表板
            // 風險指標 = (模擬權益數 / 總原始保證金) * 100%
            let risk = 0;
            if (totalInit > 0) {
                risk = (simCapital / totalInit) * 100;
            }

            if (totalInit === 0 && simCapital > 0) {
                gaugeRatio.innerText = '∞';
                gaugeStatus.innerText = '部位完全安全';
                gaugeStatus.className = 'gauge-status-label status-safe';
                rotateNeedle(200);
                
                topupBox.className = 'topup-box';
                topupTitle.innerHTML = `<span style="color: #00ff66;">🟢 目前資產安全健康，無須補繳</span>`;
                topupCash.innerText = '$0 元';
            } else if (totalInit > 0 && simCapital !== 0) {
                // 風險指標為負數時代表本金已歸零且倒貼
                const dispRisk = risk > 0 ? risk : 0;
                gaugeRatio.innerText = `${dispRisk.toFixed(2)} %`;

                // 判斷風控狀態
                if (risk >= 100) {
                    gaugeStatus.innerText = '安全 (高於原始)';
                    gaugeStatus.className = 'gauge-status-label status-safe';
                } else if (simCapital >= totalMaint) {
                    gaugeStatus.innerText = '警示 (低於原始保證金)';
                    gaugeStatus.className = 'gauge-status-label status-warn';
                } else if (risk >= 25) {
                    gaugeStatus.innerText = '追繳 (低於維持保證金)';
                    gaugeStatus.className = 'gauge-status-label status-danger';
                } else {
                    gaugeStatus.innerText = '即將強制平倉 (風險 < 25%)';
                    gaugeStatus.className = 'gauge-status-label status-danger';
                }

                // 旋轉指針：對應風險指標 0% ~ 200% 到半圓的 0 ~ 180 度 (由左至右)
                rotateNeedle(risk);

                // 5. 保證金回補試算 (需補足至 100% 總原始保證金)
                if (simCapital < totalInit) {
                    const topupAmt = totalInit - simCapital;
                    topupBox.className = 'topup-box warning-active';
                    topupTitle.innerHTML = `<span style="color: #ff3b30;">⚠️ 權益數已低於總原始保證金，回補至 100% 原始保證金水位：</span>`;
                    topupCash.innerText = topupAmt > 0 ? `$${Math.round(topupAmt).toLocaleString()} 元` : '$0 元';
                } else {
                    topupBox.className = 'topup-box';
                    topupTitle.innerHTML = `<span style="color: #00ff66;">🟢 權益數高於原始保證金，無須補繳</span>`;
                    topupCash.innerText = '$0 元';
                }
            } else {
                gaugeRatio.innerText = '- %';
                gaugeStatus.innerText = '等待輸入';
                gaugeStatus.className = 'gauge-status-label';
                rotateNeedle(100);
                
                topupBox.className = 'topup-box';
                topupTitle.innerHTML = `<span>保證金回補試算</span>`;
                topupCash.innerText = '-';
            }

            isCalculating = false;
        }

        function rotateNeedle(risk) {
            let deg = -90; // 0%
            if (risk >= 200) {
                deg = 90; // 200%
            } else if (risk <= 0) {
                deg = -90; // 0%
            } else {
                // 0 ~ 200 對應 -90 ~ 90 度
                deg = -90 + (risk - 0) * 0.9;
            }
            gaugeNeedle.style.transform = `rotate(${deg}deg)`;
        }

        // ==========================================
        // 3. 事件與千分位格式化設定
        // ==========================================

        contractTypeSelect.addEventListener('change', () => {
            updateDefaultMargins();
            // 自動重設預設本金 (例如原始保證金 * 1.5 倍)
            const singleInit = parseFloat(marginInitIn.value.replace(/,/g, '')) || 0;
            const qty = parseFloat(positionQtyIn.value) || 1;
            capitalAmountIn.value = Math.round(singleInit * qty * 1.5).toLocaleString('zh-TW');
            recalculate();
        });

        // 多空切換
        dirLongBtn.addEventListener('click', () => {
            positionDirection = "long";
            dirLongBtn.classList.add('active');
            dirShortBtn.classList.remove('active');
            recalculate();
        });
        dirShortBtn.addEventListener('click', () => {
            positionDirection = "short";
            dirShortBtn.classList.add('active');
            dirLongBtn.classList.remove('active');
            recalculate();
        });

        indexPriceIn.addEventListener('input', recalculate);
        positionQtyIn.addEventListener('input', recalculate);
        customPointValueIn.addEventListener('input', recalculate);
        stressSlider.addEventListener('input', recalculate);

        // 千分位格式化函式
        function initFormattedInput(inputId) {
            const input = document.getElementById(inputId);
            input.addEventListener('input', () => {
                let value = input.value.replace(/,/g, '');
                if (value === '') {
                    input.value = '';
                    recalculate();
                    return;
                }
                const num = parseInt(value, 10);
                if (!isNaN(num)) {
                    const originalCursor = input.selectionStart;
                    const originalCommaCount = (input.value.substring(0, originalCursor).match(/,/g) || []).length;
                    
                    const formatted = num.toLocaleString('zh-TW');
                    input.value = formatted;
                    
                    const newCommaCount = (formatted.substring(0, originalCursor).match(/,/g) || []).length;
                    const cursorOffset = newCommaCount - originalCommaCount;
                    input.setSelectionRange(originalCursor + cursorOffset, originalCursor + cursorOffset);
                }
                recalculate();
            });
        }

        // 初始化千分位
        initFormattedInput('capital-amount');
        initFormattedInput('margin-init');
        initFormattedInput('margin-maint');

        // 本金快速預設按鈕
        capPreset1Btn.addEventListener('click', () => {
            const singleInit = parseFloat(marginInitIn.value.replace(/,/g, '')) || 0;
            const qty = parseFloat(positionQtyIn.value) || 1;
            capitalAmountIn.value = Math.round(singleInit * qty * 1.5).toLocaleString('zh-TW');
            recalculate();
            showToast("已帶入 1.5 倍原始保證金本金");
        });

        capPreset2Btn.addEventListener('click', () => {
            const singleInit = parseFloat(marginInitIn.value.replace(/,/g, '')) || 0;
            const qty = parseFloat(positionQtyIn.value) || 1;
            capitalAmountIn.value = Math.round(singleInit * qty * 2.0).toLocaleString('zh-TW');
            recalculate();
            showToast("已帶入 2.0 倍原始保證金本金");
        });

        // 複製 Toast 提示
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');
        let toastTimeout = null;

        function showToast(text) {
            toastText.innerText = text;
            toast.classList.add('show');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 複製輸出數值
        document.querySelectorAll('.output-card').forEach(card => {
            card.style.cursor = 'pointer';
            card.setAttribute('title', '點擊複製此數值');
            card.addEventListener('click', () => {
                const valEl = card.querySelector('.output-val');
                if (valEl && valEl.innerText !== '-') {
                    const text = valEl.innerText.replace(' 元', '').replace(' %', '').replace(' 倍', '').replace(' 點', '').replace(/,/g, '').trim();
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`已複製數值: ${text}`);
                    });
                }
            });
        });

        // 初始化載入數據 (微台試算範例，台股 47,000 點)
        indexPriceIn.value = "47000";
        positionQtyIn.value = "1";
        updateDefaultMargins();
        capitalAmountIn.value = "100,000"; // 預設 10 萬本金

        recalculate();
    </script>
</body>
</html>
