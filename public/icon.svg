<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111b33" />
      <stop offset="55%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tileTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tileTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="tileBL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="tileBR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>
  </defs>

  <!-- 深空圓角底框 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ambientGlow)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- 左上模組：青藍圓角方塊 -->
  <rect x="96" y="96" width="136" height="136" rx="34" fill="url(#tileTL)" />
  <rect x="108" y="108" width="112" height="112" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="4" />

  <!-- 右上模組：極光綠旋轉菱形焦點 -->
  <g transform="translate(348 164) rotate(45)">
    <rect x="-58" y="-58" width="116" height="116" rx="28" fill="url(#tileTR)" />
    <rect x="-46" y="-46" width="92" height="92" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" />
  </g>

  <!-- 左下模組：靛藍圓角方塊 -->
  <rect x="96" y="280" width="136" height="136" rx="34" fill="url(#tileBL)" />
  <rect x="108" y="292" width="112" height="112" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="4" />

  <!-- 右下模組：青翠方塊 + 精密核心圓孔 -->
  <rect x="280" y="280" width="136" height="136" rx="34" fill="url(#tileBR)" />
  <circle cx="348" cy="348" r="28" fill="#070c18" />
  <circle cx="348" cy="348" r="12" fill="#00ffaa" />
</svg>
