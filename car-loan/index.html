<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車貸計算器</title>
    <link rel="icon" href="https://tools.cjkuo.net/support.svg" type="image/svg+xml">
    <meta name="description" content="專業的汽車貸款計算機，支援車價與自備款成數連動、本息/本金均攤、寬限期試算與實質年利率 (APR) 評估，助您輕鬆規劃購車預算。">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="車貸計算器">
    <meta property="og:description" content="專業的汽車貸款計算機，支援自備款成數試算、寬限期與實質年利率 (APR) 評估。">
    <meta property="og:url" content="https://tools.cjkuo.net/car-loan/index.html">
    <meta property="og:image" content="https://tools.cjkuo.net/support.svg">

    <!-- 引入 Google Fonts & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #030305;
            --glass-bg: rgba(255, 255, 255, 0.015);
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent-glow: rgba(255, 0, 85, 0.6); /* 霓虹紅主題 */
            --accent-glow-rgb: 255, 0, 85;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1rem;
        }

        /* 互動式 Canvas 背景 */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 玻璃擬物化容器 */
        .glass-container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.01);
            width: 100%;
            max-width: 1100px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 回首頁按鈕 */
        .back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            z-index: 11;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 0, 85, 0.1);
            color: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .back-btn:hover svg {
            transform: translateX(-3px);
        }

        h1 {
            font-weight: 300;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-align: center;
            text-transform: uppercase;
        }

        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            box-shadow: 0 0 8px var(--accent-glow);
            margin: 0.8rem auto 0;
            animation: glow-pulse 3s infinite ease-in-out;
        }

        .subtitle-top {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 3rem;
            text-align: center;
            text-transform: uppercase;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 1px var(--accent-glow)); }
            50% { opacity: 1; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        }

        /* 雙欄版面 */
        .calculator-grid {
            display: grid;
            grid-template-columns: 1.1fr 1.9fr;
            gap: 2.5rem;
            align-items: start;
        }

        /* ====== 左側表單樣式 ====== */
        .form-section {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .input-group label span.badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 0, 85, 0.12);
            color: #ff0055;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 6px;
            border: 1px solid rgba(255, 0, 85, 0.2);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            padding-right: 4.5rem;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: rgba(255, 0, 85, 0.6);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }

        /* 單位選擇器 */
        .unit-selector {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .unit-selector .unit-btn,
        .toggle-buttons-container .unit-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .unit-selector .unit-btn.active,
        .toggle-buttons-container .unit-btn.active {
            background: rgba(255, 0, 85, 0.15);
            color: #ff0055;
        }

        /* 獨立切換按鈕組樣式 */
        .toggle-buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            width: 100%;
        }

        .toggle-buttons-container .unit-btn {
            padding: 0.6rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: center;
            transition: all 0.3s ease;
            height: auto;
            display: block;
        }

        .toggle-buttons-container .unit-btn.active {
            background: rgba(255, 0, 85, 0.12);
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.1);
        }

        /* ====== 右側結果樣式 ====== */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            min-width: 0;
        }

        .results-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 指標看板 */
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
        }

        .indicator-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.2rem 1rem;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.005);
            transition: all 0.3s ease;
            position: relative;
        }

        .indicator-card:hover {
            border-color: rgba(255, 0, 85, 0.2);
            background: rgba(255, 255, 255, 0.015);
        }

        .indicator-card h4 {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
        }

        .indicator-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .indicator-card.total-value .value {
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .indicator-card .caption {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
        }

        /* 圖表區塊 */
        .chart-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            width: 100%;
            height: 320px;
        }

        /* 明細表格區塊 */
        .table-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            max-width: 100%;
        }

        .table-container h3 {
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.85rem;
        }

        table th {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
        }

        table td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: 'JetBrains Mono', monospace;
            color: rgba(255, 255, 255, 0.8);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
        }

        /* 平板及手機等小螢幕表格優化 */
        @media (max-width: 768px) {
            .table-container {
                padding: 1rem;
            }

            table {
                min-width: 650px;
            }

            table th:first-child,
            table td:first-child {
                position: sticky;
                left: 0;
                background-color: #0b0b0e;
                z-index: 2;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.4);
            }

            table tr:hover td:first-child {
                background-color: #1a1a24;
            }
        }

        /* 自訂滾動條 */
        .table-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .table-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 85, 0.2);
            border-radius: 3px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 0, 85, 0.4);
        }

        /* 響應式佈局 */
        @media (max-width: 900px) {
            .back-btn {
                position: static;
                display: inline-flex;
                margin-bottom: 1.5rem;
            }
            .calculator-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .glass-container {
                padding: 2.5rem 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .indicators-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .chart-container {
                height: 250px;
            }
        }

        /* 隱藏原生上下箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="glass-container">
        <!-- 回首頁 -->
        <a href="../index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59-1.42-1.42L4 12l8 8 1.42-1.42L7.83 13H20v-2z"/></svg>
            工具庫首頁
        </a>

        <h1>車貸計算器</h1>
        <div class="subtitle-top">Car Loan Calculator</div>

        <div class="calculator-grid">
            <!-- 左側表單 -->
            <div class="form-section">
                <!-- 車款總價 -->
                <div class="input-group">
                    <label for="input-car-price">車款總價</label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-car-price" value="1,200,000" placeholder="例如：1,200,000">
                        <div class="unit-selector">
                            <button class="unit-btn active" style="pointer-events: none;">元</button>
                        </div>
                    </div>
                </div>

                <!-- 自備款 -->
                <div class="input-group">
                    <label for="input-down-payment">自備款 (頭期款)</label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-down-payment" value="300,000" placeholder="例如：300,000">
                        <div class="unit-selector">
                            <button class="unit-btn active" style="pointer-events: none;">元</button>
                        </div>
                    </div>
                </div>

                <!-- 貸款金額 -->
                <div class="input-group">
                    <label for="input-loan-amount">
                        貸款金額 <span class="badge" id="loan-ratio-badge"><span id="loan-ratio-span">75.0</span>%</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-loan-amount" value="900,000" placeholder="例如：900,000">
                        <div class="unit-selector">
                            <button class="unit-btn active" style="pointer-events: none;">元</button>
                        </div>
                    </div>
                </div>

                <!-- 貸款年利率 -->
                <div class="input-group">
                    <label for="input-rate">年利率 (%)</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-rate" value="2.99" min="0" step="0.01" placeholder="例如：2.99">
                        <div class="unit-selector" style="pointer-events: none; background: transparent; border: none; right: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">%</div>
                    </div>
                </div>

                <!-- 貸款期間 -->
                <div class="input-group">
                    <label for="input-period">貸款期間</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-period" value="5" min="1" placeholder="例如：5">
                        <div class="unit-selector" id="period-unit-selector">
                            <button class="unit-btn active" data-unit="year">年</button>
                            <button class="unit-btn" data-unit="month">月</button>
                        </div>
                    </div>
                </div>

                <!-- 寬限期 -->
                <div class="input-group">
                    <label for="input-grace-period">寬限期 (月)</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-grace-period" value="0" min="0" max="120" placeholder="0 ~ 12 (月)">
                        <div class="unit-selector" style="pointer-events: none; background: transparent; border: none; right: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">月</div>
                    </div>
                </div>

                <!-- 動保費 / 設定費 -->
                <div class="input-group">
                    <label for="input-fee">動保設定費 / 手續費</label>
                    <div class="input-wrapper">
                        <input type="text" inputmode="numeric" id="input-fee" value="3,500" placeholder="例如：3,500">
                        <div class="unit-selector" style="pointer-events: none; background: transparent; border: none; right: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">元</div>
                    </div>
                </div>

                <!-- 還款方式 -->
                <div class="input-group">
                    <label>還款方式</label>
                    <div class="toggle-buttons-container" id="repay-type-selector">
                        <button class="unit-btn active" data-unit="equal-total">本息均攤</button>
                        <button class="unit-btn" data-unit="equal-principal">本金均攤</button>
                    </div>
                </div>
            </div>

            <!-- 右側結果與圖表 -->
            <div class="results-section" id="results-sec">
                <!-- 看板 -->
                <div class="indicators-grid">
                    <div class="indicator-card total-value">
                        <h4>每月還款額 (首期)</h4>
                        <div class="value" id="val-monthly">0</div>
                        <span class="caption" id="val-monthly-caption">本息平均攤還</span>
                    </div>
                    <div class="indicator-card">
                        <h4>實質年利率 (APR)</h4>
                        <div class="value" style="color: #ff0055;" id="val-apr">0 %</div>
                        <span class="caption">含設定費攤提真實利率</span>
                    </div>
                    <div class="indicator-card">
                        <h4>總利息支出</h4>
                        <div class="value" id="val-interest">0</div>
                        <span class="caption">貸款期間付出的利息總和</span>
                    </div>
                    <div class="indicator-card">
                        <h4>總還款金額</h4>
                        <div class="value" id="val-total">0</div>
                        <span class="caption" id="val-total-caption">含本息及設定規費</span>
                    </div>
                </div>

                <!-- 圖表 -->
                <div class="chart-container">
                    <canvas id="balance-chart"></canvas>
                </div>

                <!-- 明細表格 -->
                <div class="table-container">
                    <h3 id="table-title">車貸還款明細表</h3>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: left;">期數</th>
                                <th>期初餘額</th>
                                <th>當期本金</th>
                                <th>當期利息</th>
                                <th>當期本息</th>
                                <th>期末餘額</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- 由 JS 動態生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 介面按鈕交互 (單位與模式切換)
        // ==========================================
        function setupSelector(containerId, callback) {
            const container = document.getElementById(containerId);
            const buttons = container.querySelectorAll('.unit-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    // 觸發紅泡沫粒子爆發微動效！
                    createBurst(e.clientX, e.clientY);
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (callback) callback(btn.getAttribute('data-unit'));
                });
            });
        }

        let periodUnit = 'year';       // 'year' or 'month'
        let repayType = 'equal-total'; // 'equal-total' or 'equal-principal'

        setupSelector('period-unit-selector', (unit) => { periodUnit = unit; calculateLoan(); });
        setupSelector('repay-type-selector', (type) => { repayType = type; calculateLoan(); });

        // ==========================================
        // 車貸計算核心與圖表渲染
        // ==========================================
        let chartInstance = null;

        function formatCurrency(num) {
            return Math.round(num).toLocaleString('zh-TW');
        }

        // 二分法求解實質年利率 (APR)
        // 使得 貸款金額 - 設定費 = 每月還款額的折現總和
        function calculateAPR(loanAmount, fee, payments) {
            const netAmount = loanAmount - fee;
            if (netAmount <= 0) return 0;

            let low = 0;
            let high = 2; // 月折現率上限 200%
            let mid = 0;

            for (let iter = 0; iter < 80; iter++) {
                mid = (low + high) / 2;
                let npv = -netAmount;
                for (let t = 0; t < payments.length; t++) {
                    npv += payments[t] / Math.pow(1 + mid, t + 1);
                }

                if (npv > 0) {
                    low = mid;
                } else {
                    high = mid;
                }
            }

            return mid * 12 * 100;
        }

        function calculateLoan() {
            const carPrice = parseVal('input-car-price');
            const downPayment = parseVal('input-down-payment');
            const loanAmount = parseVal('input-loan-amount');
            const ratePercent = parseFloat(document.getElementById('input-rate').value) || 0;
            const periodVal = parseFloat(document.getElementById('input-period').value) || 0;
            let gracePeriodInput = parseInt(document.getElementById('input-grace-period').value, 10) || 0;
            const fee = parseVal('input-fee');

            // 1. 計算總期數
            const totalMonths = Math.max(0, periodUnit === 'year' ? periodVal * 12 : periodVal);

            // 2. 限制與防呆寬限期 (不能大於等於總月數，且至少大於等於 0)
            if (gracePeriodInput < 0) gracePeriodInput = 0;
            if (totalMonths > 0 && gracePeriodInput >= totalMonths) {
                gracePeriodInput = totalMonths - 1;
                document.getElementById('input-grace-period').value = gracePeriodInput;
            }
            const graceMonths = gracePeriodInput;

            // 3. 準備數據模型
            const resultData = [];
            let totalInterest = 0;
            let firstPayment = 0;
            let afterGracePayment = 0;

            // 初始狀態
            resultData.push({
                period: 0,
                startBalance: 0,
                principalPaid: 0,
                interestPaid: 0,
                totalPayment: 0,
                endBalance: loanAmount,
                isGrace: false
            });

            if (totalMonths > 0 && loanAmount > 0) {
                const monthlyRate = (ratePercent / 100) / 12;
                const paymentArray = [];
                let remainingBalance = loanAmount;

                // 寬限期內月付額 (只付利息)
                const interestOnlyPayment = loanAmount * monthlyRate;

                // 寬限期後賸餘期數
                const amortizeMonths = totalMonths - graceMonths;

                if (repayType === 'equal-total') {
                    // 本息平均攤還
                    let amortizedMonthlyPayment = 0;
                    if (amortizeMonths > 0) {
                        if (monthlyRate === 0) {
                            amortizedMonthlyPayment = loanAmount / amortizeMonths;
                        } else {
                            amortizedMonthlyPayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, amortizeMonths)) / (Math.pow(1 + monthlyRate, amortizeMonths) - 1);
                        }
                    }

                    firstPayment = graceMonths > 0 ? interestOnlyPayment : amortizedMonthlyPayment;
                    afterGracePayment = amortizedMonthlyPayment;

                    // 歷期試算
                    for (let m = 1; m <= totalMonths; m++) {
                        const startBal = remainingBalance;
                        let interestThisMonth = remainingBalance * monthlyRate;
                        let principalThisMonth = 0;
                        let totalPaymentThisMonth = 0;
                        let isGrace = false;

                        if (m <= graceMonths) {
                            // 寬限期：只付息，不還本
                            isGrace = true;
                            principalThisMonth = 0;
                            interestThisMonth = startBal * monthlyRate;
                            totalPaymentThisMonth = interestThisMonth;
                        } else {
                            // 攤還期：本息均攤
                            totalPaymentThisMonth = amortizedMonthlyPayment;
                            interestThisMonth = remainingBalance * monthlyRate;
                            principalThisMonth = totalPaymentThisMonth - interestThisMonth;
                            remainingBalance -= principalThisMonth;
                        }

                        if (m === totalMonths) {
                            remainingBalance = 0; // 消除浮點數誤差
                        }

                        totalInterest += interestThisMonth;
                        paymentArray.push(totalPaymentThisMonth);

                        resultData.push({
                            period: m,
                            startBalance: startBal,
                            principalPaid: principalThisMonth,
                            interestPaid: interestThisMonth,
                            totalPayment: totalPaymentThisMonth,
                            endBalance: Math.max(0, remainingBalance),
                            isGrace: isGrace
                        });
                    }
                } else {
                    // 本金平均攤還
                    const principalPerMonth = amortizeMonths > 0 ? loanAmount / amortizeMonths : 0;

                    // 歷期試算
                    for (let m = 1; m <= totalMonths; m++) {
                        const startBal = remainingBalance;
                        let interestThisMonth = remainingBalance * monthlyRate;
                        let principalThisMonth = 0;
                        let totalPaymentThisMonth = 0;
                        let isGrace = false;

                        if (m <= graceMonths) {
                            // 寬限期：只付息
                            isGrace = true;
                            principalThisMonth = 0;
                            interestThisMonth = startBal * monthlyRate;
                            totalPaymentThisMonth = interestThisMonth;
                        } else {
                            // 攤還期：本金均攤
                            principalThisMonth = principalPerMonth;
                            interestThisMonth = remainingBalance * monthlyRate;
                            totalPaymentThisMonth = principalThisMonth + interestThisMonth;
                            remainingBalance -= principalThisMonth;
                        }

                        if (m === totalMonths) {
                            remainingBalance = 0;
                        }

                        if (m === 1) {
                            firstPayment = totalPaymentThisMonth;
                        } else if (m === graceMonths + 1) {
                            // 寬限期剛結束的第一期月付額
                            afterGracePayment = totalPaymentThisMonth;
                        }
                        totalInterest += interestThisMonth;
                        paymentArray.push(totalPaymentThisMonth);

                        resultData.push({
                            period: m,
                            startBalance: startBal,
                            principalPaid: principalThisMonth,
                            interestPaid: interestThisMonth,
                            totalPayment: totalPaymentThisMonth,
                            endBalance: Math.max(0, remainingBalance),
                            isGrace: isGrace
                        });
                    }

                    if (graceMonths === 0) {
                        afterGracePayment = firstPayment; // 無寬限期則一致
                    }
                }

                // 計算實質年利率 (APR)
                const apr = calculateAPR(loanAmount, fee, paymentArray);
                document.getElementById('val-apr').textContent = apr.toFixed(2) + ' %';
            } else {
                document.getElementById('val-apr').textContent = ratePercent.toFixed(2) + ' %';
            }

            // 4. 更新指標看板與文字提示
            document.getElementById('val-monthly').textContent = formatCurrency(firstPayment);
            
            // 首期月付額副標提示
            const methodText = repayType === 'equal-total' ? '本息均攤' : '本金均攤';
            if (graceMonths > 0) {
                document.getElementById('val-monthly-caption').innerHTML = 
                    `<span style="color:#ff0055;">前 ${graceMonths} 期寬限付息</span>，第 ${graceMonths + 1} 期起月付 $${formatCurrency(afterGracePayment)}`;
            } else {
                document.getElementById('val-monthly-caption').textContent = 
                    `${methodText}${repayType === 'equal-principal' ? '（首月最高，逐月遞減）' : ''}`;
            }

            document.getElementById('val-interest').textContent = formatCurrency(totalInterest);
            document.getElementById('val-total').textContent = formatCurrency(loanAmount + totalInterest + fee);
            document.getElementById('val-total-caption').textContent = `含本金、利息與 $${formatCurrency(fee)} 設定費`;

            // 5. 更新明細表格
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            resultData.forEach(item => {
                const tr = document.createElement('tr');
                const isInitial = item.period === 0;
                
                let periodLabel = isInitial ? '初始' : `第 ${item.period} 期`;
                if (item.isGrace) {
                    periodLabel += ' <span style="font-size:0.75rem; color:#ff0055; padding-left:2px;">[寬限]</span>';
                }

                tr.innerHTML = `
                    <td style="text-align: left; color: var(--text-secondary);">${periodLabel}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.startBalance)}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.principalPaid)}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.interestPaid)}</td>
                    <td>${isInitial ? '-' : formatCurrency(item.totalPayment)}</td>
                    <td style="color: #ff0055; font-weight: 500;">${formatCurrency(item.endBalance)}</td>
                `;
                tbody.appendChild(tr);
            });

            // 6. 更新 Chart.js 圖表 (賫餘本金折線圖)
            const labels = resultData.map(item => isNaN(item.period) || item.period === 0 ? '初始' : `第 ${item.period} 期`);
            const balanceDataset = resultData.map(item => item.endBalance);

            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctxChart = document.getElementById('balance-chart').getContext('2d');
            chartInstance = new Chart(ctxChart, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '賸餘本金餘額',
                            data: balanceDataset,
                            backgroundColor: 'rgba(255, 0, 85, 0.1)',
                            borderColor: 'rgba(255, 0, 85, 0.85)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1,
                            pointRadius: labels.length > 50 ? 0 : 2,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#8892b0',
                                font: { family: 'Inter' }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + formatCurrency(context.parsed.y);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { color: '#8892b0', font: { family: 'Inter' } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { 
                                color: '#8892b0', 
                                font: { family: 'Inter' },
                                callback: function(value) {
                                    return value >= 1000000 
                                        ? (value / 1000000).toFixed(1) + 'M' 
                                        : value >= 1000 ? (value / 1000).toFixed(0) + 'K' : value;
                                }
                            }
                        }
                    }
                }
            });

            // 顯示結果區塊
            const resSec = document.getElementById('results-sec');
            resSec.classList.add('show');
        }

        // ==========================================
        // 車貸輸入關聯性同步
        // ==========================================
        function parseVal(id) {
            return parseFloat(document.getElementById(id).value.replace(/,/g, '')) || 0;
        }

        function formatElementValue(id, val) {
            const el = document.getElementById(id);
            el.value = Math.round(val).toLocaleString('zh-TW');
        }

        function syncInputs(changedId) {
            let carPrice = parseVal('input-car-price');
            let downPayment = parseVal('input-down-payment');
            let loanAmount = parseVal('input-loan-amount');

            if (changedId === 'input-car-price') {
                if (carPrice < 0) carPrice = 0;
                // 若車款變更，如果自備款大於車價，則自備款等於車價
                if (downPayment > carPrice) {
                    downPayment = carPrice;
                    formatElementValue('input-down-payment', downPayment);
                }
                loanAmount = carPrice - downPayment;
                formatElementValue('input-loan-amount', loanAmount);
            } else if (changedId === 'input-down-payment') {
                if (downPayment < 0) downPayment = 0;
                // 自備款不能大於車款
                if (downPayment > carPrice) {
                    downPayment = carPrice;
                    formatElementValue('input-down-payment', downPayment);
                }
                loanAmount = carPrice - downPayment;
                formatElementValue('input-loan-amount', loanAmount);
            } else if (changedId === 'input-loan-amount') {
                if (loanAmount < 0) loanAmount = 0;
                // 貸款金額不能大於車款
                if (loanAmount > carPrice) {
                    loanAmount = carPrice;
                    formatElementValue('input-loan-amount', loanAmount);
                }
                downPayment = carPrice - loanAmount;
                formatElementValue('input-down-payment', downPayment);
            }

            // 計算貸款成數百分比
            const ratio = carPrice > 0 ? (loanAmount / carPrice * 100) : 0;
            document.getElementById('loan-ratio-span').textContent = ratio.toFixed(1);

            calculateLoan();
        }

        // 綁定輸入千分位格式化與游標維持
        function bindSyncedInput(id) {
            const input = document.getElementById(id);
            input.addEventListener('input', (e) => {
                let rawVal = input.value.replace(/,/g, '');
                if (rawVal === '') {
                    input.value = '';
                    if (id === 'input-car-price') {
                        formatElementValue('input-loan-amount', 0);
                        formatElementValue('input-down-payment', 0);
                    } else if (id === 'input-down-payment') {
                        const carPrice = parseVal('input-car-price');
                        formatElementValue('input-loan-amount', carPrice);
                    } else if (id === 'input-loan-amount') {
                        const carPrice = parseVal('input-car-price');
                        formatElementValue('input-down-payment', carPrice);
                    }
                    document.getElementById('loan-ratio-span').textContent = '0.0';
                    calculateLoan();
                    return;
                }

                const num = parseInt(rawVal, 10);
                if (!isNaN(num)) {
                    const originalCursor = input.selectionStart;
                    const originalCommaCount = (input.value.substring(0, originalCursor).match(/,/g) || []).length;
                    
                    const formatted = num.toLocaleString('zh-TW');
                    input.value = formatted;
                    
                    const newCommaCount = (formatted.substring(0, originalCursor).match(/,/g) || []).length;
                    const cursorOffset = newCommaCount - originalCommaCount;
                    input.setSelectionRange(originalCursor + cursorOffset, originalCursor + cursorOffset);
                }

                syncInputs(id);
            });
        }

        // 單獨格式化非連動之金額輸入框 (如設定費)
        function initFormattedInput(inputId) {
            const input = document.getElementById(inputId);
            input.addEventListener('input', () => {
                let value = input.value.replace(/,/g, '');
                if (value === '') {
                    input.value = '';
                    calculateLoan();
                    return;
                }
                const num = parseInt(value, 10);
                if (!isNaN(num)) {
                    const originalCursor = input.selectionStart;
                    const originalCommaCount = (input.value.substring(0, originalCursor).match(/,/g) || []).length;
                    
                    const formatted = num.toLocaleString('zh-TW');
                    input.value = formatted;
                    
                    const newCommaCount = (formatted.substring(0, originalCursor).match(/,/g) || []).length;
                    const cursorOffset = newCommaCount - originalCommaCount;
                    input.setSelectionRange(originalCursor + cursorOffset, originalCursor + cursorOffset);
                }
                calculateLoan();
            });

            if (input.value) {
                const num = parseInt(input.value.replace(/,/g, ''), 10);
                if (!isNaN(num)) {
                    input.value = num.toLocaleString('zh-TW');
                }
            }
        }

        // 初始化與事件綁定
        window.addEventListener('load', () => {
            bindSyncedInput('input-car-price');
            bindSyncedInput('input-down-payment');
            bindSyncedInput('input-loan-amount');
            initFormattedInput('input-fee');

            // 格式化預設值
            formatElementValue('input-car-price', parseVal('input-car-price'));
            formatElementValue('input-down-payment', parseVal('input-down-payment'));
            formatElementValue('input-loan-amount', parseVal('input-loan-amount'));
            
            document.getElementById('input-rate').addEventListener('input', calculateLoan);
            document.getElementById('input-period').addEventListener('input', calculateLoan);
            document.getElementById('input-grace-period').addEventListener('input', calculateLoan);
            
            // 初次計算
            syncInputs('input-car-price');
        });
    </script>

    <script>
        // ==========================================
        // 背景粒子與特效動畫 (霓虹紅主題)
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (typeof adjustParticles === 'function') {
                adjustParticles();
            }
        }

        class Particle {
            constructor(x = null, y = null, isBurst = false) {
                this.x = x !== null ? x : Math.random() * canvas.width;
                this.y = y !== null ? y : Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5; 
                this.density = (Math.random() * 30) + 1;
                
                this.isBurst = isBurst;
                this.life = isBurst ? 1.0 : -1; 
                
                if (isBurst) {
                    this.velocityX = (Math.random() - 0.5) * 5; 
                    this.velocityY = (Math.random() - 0.5) * 5;
                } else {
                    this.velocityY = -((Math.random() * 0.4) + 0.1); // 紅色泡沫緩慢往上飄
                    this.velocityX = (Math.random() - 0.5) * 0.2;
                }
            }
            draw() {
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.closePath();
                
                let alpha = this.isBurst ? this.life : this.size / 3.5;
                
                // 霓虹紅 (#ff0055)
                ctx.fillStyle = this.isBurst 
                    ? `rgba(255, 0, 85, ${alpha})` 
                    : `rgba(255, 0, 85, ${alpha * 0.8})`; 
                ctx.fill();
            }
            update() {
                if (this.isBurst) {
                    this.x += this.velocityX;
                    this.y += this.velocityY;
                    this.life -= 0.025; 
                    this.velocityX *= 0.95;
                    this.velocityY *= 0.95;
                } else {
                    this.y += this.velocityY;
                    this.x += this.velocityX;
                    
                    if (this.y < 0) {
                        this.y = canvas.height;
                        this.x = Math.random() * canvas.width;
                    }
                }
            }
        }

        function adjustParticles() {
            particles = [];
            const numberOfParticles = Math.min(60, (canvas.width * canvas.height) / 25000);
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function createBurst(x, y) {
            if (x === undefined || y === undefined) return;
            const burstCount = 15;
            for (let i = 0; i < burstCount; i++) {
                particles.push(new Particle(x, y, true));
            }
        }

        function initParticles() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 監聽滑鼠
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.x;
                mouse.y = e.y;
            });
            window.addEventListener('mouseout', () => {
                mouse.x = null;
                mouse.y = null;
            });

            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                if (particles[i].isBurst && particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('load', initParticles);
    </script>
</body>
</html>
