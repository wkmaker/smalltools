name: Build & Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # OIDC 驗證所需的權限
    permissions:
      id-token: write
      contents: read

    steps:
      # ── 1. 拉取代碼 ──────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. 檢測 template.yml 是否有修改 ─────────────────────
      - name: Check CloudFormation Template Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cf_template:
              - 'template.yml'

      # ── 3. 設定 Node.js 環境（含 npm 快取） ──────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 4. 安裝依賴 ──────────────────────────────────────────
      - name: Install Dependencies
        run: npm ci

      # ── 5. Next.js SSG 建置 → 產出 out/ 目錄 ────────────────
      - name: Build Next.js SSG
        run: npm run build
        env:
          NODE_ENV: production

      # ── 6. 設定 AWS 憑證 (使用 OIDC Role) ───────────────────
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── 7. 更新 CloudFormation 基礎架構（僅在 template.yml 變動時執行） ──
      - name: Deploy CloudFormation Stack
        if: steps.filter.outputs.cf_template == 'true'
        uses: aws-actions/aws-cloudformation-deploy@v1
        with:
          name: web-tool-cjkuo-stack
          template: template.yml
          no-fail-on-empty-changeset: "1"

      # ── 8. 同步 out/ 至 S3 ───────────────────────────────────
      - name: Sync to S3
        run: |
          # HTML 檔案：短快取 300 秒（確保更新後用戶能快速看到新版）
          aws s3 sync ./out s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude "*.css" \
            --exclude "*.js" \
            --exclude "*.woff2" \
            --exclude "*.woff" \
            --exclude "_next/static/*" \
            --exclude "img/*" \
            --cache-control "public, max-age=300, s-maxage=300"

          # JS / CSS / 字型：Next.js 會生成 content hash 檔名，可長快取 1 年
          aws s3 sync ./out/_next/static s3://${{ secrets.AWS_S3_BUCKET }}/_next/static \
            --cache-control "public, max-age=31536000, immutable"

          # img/ 靜態圖片：快取 1 天
          aws s3 sync ./out/img s3://${{ secrets.AWS_S3_BUCKET }}/img \
            --delete \
            --cache-control "public, max-age=86400"

          # SVG 圖片（support.svg 等）：強制正確 MIME + 快取 300 秒
          aws s3 sync ./out s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.svg" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=600"

      # ── 9. 清除 CloudFront 快取 ──────────────────────────────
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
