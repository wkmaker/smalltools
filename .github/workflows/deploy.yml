name: Deploy to AWS S3 & Clear CloudFront Cache

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          # 1. 先同步所有檔案（排除 SVG, .agents, .git, .github，設定快取 300 秒）
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} --delete --exclude "*.svg" --exclude ".agents*" --exclude ".git*" --exclude ".github*" --cache-control "max-age=300"
          
          # 2. 單獨同步 SVG 檔案，並強制指定正確的 MIME 類型與快取 300 秒
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} --exclude "*" --include "*.svg" --content-type "image/svg+xml" --cache-control "max-age=300"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
