name: 部署 smalltools

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.agents/**'
  workflow_dispatch:

permissions:
  id-token: write # 用於 AWS OIDC 無金鑰認證
  contents: read

# 同時間只跑一個部署，新的排隊等舊的完成，避免 S3 同步互相覆蓋
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    # 尚未執行 infra/bootstrap.sh 前沒有部署角色，直接略過而不是失敗
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: production
      stack-name: smalltools-site
      deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      cfn-exec-role-arn: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
      domain: ${{ vars.SITE_DOMAIN }}
      attach-domain: ${{ vars.SITE_ATTACH_DOMAIN || 'false' }}
