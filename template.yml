AWSTemplateFormatVersion: '2010-09-09'
Description: 'Infrastructure template for static website hosting with S3, CloudFront, WAF, and optional Staging/Dev controls'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod, dev, stg]
    Description: Environment name (prod, dev, or stg)

  BucketName:
    Type: String
    Default: web-tool-cjkuo
    Description: S3 Bucket Name

  EnableBasicAuth:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable HTTP Basic Authentication via CloudFront Function

  BasicAuthBase64:
    Type: String
    Default: ''
    NoEcho: true
    Description: Base64 encoded string of "username:password" for Basic Auth

  EnableNoIndexHeader:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable X-Robots-Tag noindex, nofollow response header

  DomainName:
    Type: String
    Default: tools.cjkuo.net
    Description: CloudFront Alias Domain Name (leave empty if no custom domain)

  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:114571653217:certificate/3c20f7ce-b2ba-4ba3-b229-c11ecacc8582
    Description: ACM Certificate ARN for CloudFront Custom Domain

  WebACLArn:
    Type: String
    Default: ''
    Description: WAF WebACL ARN (leave empty for dev/stg environments or if no WAF is associated)

Conditions:
  IsNoIndexEnabled: !Equals [!Ref EnableNoIndexHeader, 'true']
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  HasWebACL: !Not [!Equals [!Ref WebACLArn, '']]

Resources:
  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      # 僅允許 CloudFront 透過 OAC 讀取，Bucket 本身不對外公開
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # 僅允許本 Distribution 透過 OAC (SigV4) 讀取
          - Sid: AllowCloudFrontOriginAccessControl
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${StaticWebsiteBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${StaticWebsiteDistribution}"

  StaticWebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: SigV4 signed access from CloudFront to the S3 REST endpoint
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-viewer-request"
      AutoPublish: true
      FunctionConfig:
        Comment: Optional Basic Auth for Dev/Staging and directory index rewrite for the S3 REST origin
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;

            // 測試環境 Basic Auth；免除 PWA 描述檔、Service Worker 與 OG 圖片的攔截 (解決 401 錯誤)
            var basicAuthEnabled = '${EnableBasicAuth}' === 'true';
            var isAuthExempt = uri === '/manifest.webmanifest' || uri === '/sw.js' || uri === '/favicon.ico' || uri.indexOf('opengraph-image') !== -1;
            if (basicAuthEnabled && !isAuthExempt) {
                var headers = request.headers;
                var expectedAuth = 'Basic ${BasicAuthBase64}';
                if (typeof headers.authorization === 'undefined' || headers.authorization.value !== expectedAuth) {
                    return {
                        statusCode: 401,
                        statusDescription: 'Unauthorized',
                        headers: {
                            'www-authenticate': { value: 'Basic realm="Dev Access Required"' }
                        }
                    };
                }
            }

            // S3 REST 端點不會自動解析目錄索引：以 / 結尾的路徑補上 index.html
            if (uri.charAt(uri.length - 1) === '/') {
                request.uri = uri + 'index.html';
                return request;
            }

            // 無副檔名路徑比照 S3 靜態網站行為 301 補斜線（opengraph-image 為無副檔名的實體檔案，須排除）
            var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
            if (lastSegment.indexOf('.') === -1 && lastSegment !== 'opengraph-image') {
                var query = [];
                var keys = Object.keys(request.querystring);
                for (var i = 0; i < keys.length; i++) {
                    var param = request.querystring[keys[i]];
                    var values = param.multiValue ? param.multiValue : [param];
                    for (var j = 0; j < values.length; j++) {
                        query.push(values[j].value === '' ? keys[i] : keys[i] + '=' + values[j].value);
                    }
                }
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: {
                        location: { value: uri + '/' + (query.length > 0 ? '?' + query.join('&') : '') }
                    }
                };
            }

            return request;
        }

  NoIndexResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: IsNoIndexEnabled
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-noindex-policy"
        Comment: Response headers policy for blocking search engine indexing
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: noindex, nofollow, noarchive
              Override: true

  StaticWebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    Properties:
      DistributionConfig:
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        DefaultRootObject: index.html
        Origins:
          - Id: S3RestOrigin
            DomainName: !GetAtt StaticWebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt StaticWebsiteOriginAccessControl.Id
            ConnectionAttempts: 3
            ConnectionTimeout: 10
        DefaultCacheBehavior:
          TargetOriginId: S3RestOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - HEAD
            - GET
          CachedMethods:
            - HEAD
            - GET
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !If [IsNoIndexEnabled, !Ref NoIndexResponseHeadersPolicy, !Ref "AWS::NoValue"]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
        CustomErrorResponses:
          # S3 REST 端點在未授予 ListBucket 時，物件不存在會回 403，統一導向 404 頁
          - ErrorCode: 403
            ResponsePagePath: /404.html
            ResponseCode: 404
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponsePagePath: /404.html
            ResponseCode: 404
            ErrorCachingMinTTL: 10
        Comment: !Sub "tools_web_${Environment}"
        PriceClass: PriceClass_All
        Enabled: true
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWebACL, !Ref WebACLArn, !Ref "AWS::NoValue"]
        HttpVersion: http2and3
        IPV6Enabled: true

Outputs:
  BucketName:
    Description: "S3 Bucket Name"
    Value: !Ref StaticWebsiteBucket
  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref StaticWebsiteDistribution
  DistributionDomainName:
    Description: "CloudFront Distribution Domain Name"
    Value: !GetAtt StaticWebsiteDistribution.DomainName
