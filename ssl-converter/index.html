        .meta-value.success {

        .output-name {

        /* 響應式佈局 */
        @media (max-width: 1024px) {

            .page-description {

    <canvas id="particle-canvas"></canvas>

    <div class="glass-container">
        <!-- 返回按鈕 -->
        <a href="../index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            回工具庫首頁
        </a>

        <!-- 頁首 -->
        <div class="header">
            <h1><span>SSL</span> 線上憑證格式轉換器</h1>
            <p class="page-description">專業免費的線上 SSL 憑證格式轉換器，支援 PEM, DER, PFX/P12 憑證格式雙向安全轉換、效期檢測與私鑰 Modulus 雜湊配對比對。</p>
            <div class="subtitle">SSL Certificate Converter</div>
        </div>

        <!-- 警告提示區 -->
        <div class="alert-box" id="alert-box">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span id="alert-message"></span>
        </div>

        <!-- 標籤組 -->
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('pfx-to-pem')">PFX / P12 轉 PEM</button>
            <button class="tab-btn" onclick="switchTab('pem-to-pfx')">PEM 轉 PFX / P12</button>
            <button class="tab-btn" onclick="switchTab('der-to-pem')">DER 轉 PEM</button>
            <button class="tab-btn" onclick="switchTab('pem-to-der')">PEM 轉 DER</button>
        </div>

        <!-- 卡片 1: PFX 轉 PEM -->
        <div class="tab-content active" id="pfx-to-pem">
            <div class="upload-zone" id="pfx-upload-zone">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>

                <input type="file" class="file-input" id="pfx-file-input" accept=".pfx,.p12">
            </div>
            
            <div class="selected-file-info" id="pfx-file-info">
                <span class="file-name-label" id="pfx-file-name"></span>
                <button class="btn-remove-file" onclick="clearUpload('pfx')">移除</button>

                    </button>

                <div class="input-group">

                </div>
            </div>

                <textarea class="custom-textarea" id="pem-cabundle" placeholder="-----BEGIN CERTIFICATE-----&#10;... (多個中繼憑證請直接首尾相連黏貼)"></textarea>
            </div>

            <div class="pem-grid">
                <div class="input-group">
                    <label class="input-label">欲設定的 PFX 密碼 <span style="color: var(--danger-color)">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" class="custom-input" id="pem-password" placeholder="請設定保護密碼">
                        <button class="toggle-password" onclick="togglePasswordVisibility('pem-password')">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">憑證別名 Friendly Name (選填)</label>
                    <input type="text" class="custom-input" id="pem-friendly-name" placeholder="預設：ssl-converter-certificate">
                </div>
            </div>

            <button class="btn-convert" onclick="convertPemToPfx()">
                驗證配對並打包下載 PFX
            </button>
        </div>

        <!-- 卡片 3: DER 轉 PEM -->
        <div class="tab-content" id="der-to-pem">
            <div class="upload-zone" id="der-upload-zone">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <p>將二進位 .der, .cer 或 .crt 檔案拖曳至此，或點擊選擇檔案</p>
                <span>支援二進位 DER 編碼的憑證或私鑰檔</span>
                <input type="file" class="file-input" id="der-file-input" accept=".der,.cer,.crt">
            </div>

            <div class="selected-file-info" id="der-file-info">
                <span class="file-name-label" id="der-file-name"></span>
                <button class="btn-remove-file" onclick="clearUpload('der')">移除</button>
            </div>

            <button class="btn-convert" onclick="convertDerToPem()">
                開始轉換為 PEM 文字
            </button>
        </div>

        <!-- 卡片 4: PEM 轉 DER -->
        <div class="tab-content" id="pem-to-der">
            <div class="input-group">
                <label class="input-label">請粘貼 PEM 文字憑證或私鑰 (.crt / .pem / .key)</label>
                <textarea class="custom-textarea" id="pem-der-input" style="height: 250px;" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"></textarea>
            </div>

            <button class="btn-convert" onclick="convertPemToDer()">
                開始轉換並下載二進位 DER
            </button>
        </div>

        <!-- 轉換結果卡片 (通用) -->
        <div class="result-section" id="result-section">
            <div class="result-title">
                <span>轉換成果與憑證解析資訊</span>
                <button class="btn-mini" onclick="document.getElementById('result-section').style.display='none'">隱藏</button>
            </div>

            <!-- 動態 AIA 中繼憑證修復提示區 -->
            <div id="aia-fix-container" style="display: none; width: 100%;"></div>

            <div class="result-meta-grid" id="result-meta">
                <!-- 注入 metadata -->
            </div>

            <div class="result-outputs" id="result-outputs">
                <!-- 注入轉換完成的 outputs -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // UI 及上傳拖曳互動
        // ==========================================
        let uploadedFiles = {
            pfx: null,
            der: null
        };

        let currentChainPems = [];
        let lastResultData = null;

        // 標籤頁切換
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.getAttribute('onclick').includes(tabId));
            if (activeBtn) activeBtn.classList.add('active');
            
            document.getElementById(tabId).classList.add('active');
            hideAlert();
        }

        // 密碼眼睛切換
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        // 設定拖曳區事件
        function setupUploadZone(zoneId, inputId, type) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);
            const info = document.getElementById(`${type}-file-info`);
            const nameLabel = document.getElementById(`${type}-file-name`);

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFileSelect(e.dataTransfer.files[0], type, zone, info, nameLabel);
                }
            });

            input.addEventListener('change', (e) => {
                if (input.files.length > 0) {
                    handleFileSelect(input.files[0], type, zone, info, nameLabel);
                }
            });
        }

        function handleFileSelect(file, type, zone, info, nameLabel) {
            uploadedFiles[type] = file;
            nameLabel.textContent = `${file.name} (${formatBytes(file.size)})`;
            zone.style.display = 'none';
            info.style.display = 'flex';
            hideAlert();
        }

        function clearUpload(type) {
            uploadedFiles[type] = null;
            document.getElementById(`${type}-file-input`).value = '';
            document.getElementById(`${type}-upload-zone`).style.display = 'flex';
            document.getElementById(`${type}-file-info`).style.display = 'none';
            hideAlert();
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        setupUploadZone('pfx-upload-zone', 'pfx-file-input', 'pfx');
        setupUploadZone('der-upload-zone', 'der-file-input', 'der');


        // ==========================================
        // 警告彈窗邏輯
        // ==========================================
        const alertBox = document.getElementById('alert-box');
        const alertMsg = document.getElementById('alert-message');

        function showAlert(message, type = 'error') {
            alertMsg.textContent = message;
            alertBox.className = 'alert-box';
            
            if (type === 'error') {
                alertBox.classList.add('error');
            } else if (type === 'warning') {
                alertBox.classList.add('warning');
            } else if (type === 'success') {
                alertBox.classList.add('success');
            }
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }


        // ==========================================
        // 憑證過期動態預警 (notAfter 解析)
        // ==========================================
        function checkCertificateExpiry(certObj) {
            if (!certObj || !certObj.validity || !certObj.validity.notAfter) return null;
            
            const notAfter = certObj.validity.notAfter;
            const today = new Date();
            const timeDiff = notAfter - today;
            const daysRemaining = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
            
            if (daysRemaining <= 30) {
                document.documentElement.style.setProperty('--accent-glow', '#ff3b30');
                document.documentElement.style.setProperty('--accent-glow-rgb', '255, 59, 48');
                
                if (daysRemaining < 0) {
                    showAlert(`憑證警告：此憑證已於 ${Math.abs(daysRemaining)} 天前過期！`, 'error');
                } else {
                    showAlert(`憑證警告：此憑證即將於 ${daysRemaining} 天後過期，請儘速更新！`, 'warning');
                }
            } else {
                document.documentElement.style.setProperty('--accent-glow', '#00ffaa');
                document.documentElement.style.setProperty('--accent-glow-rgb', '0, 255, 170');
            }
            return daysRemaining;
        }

        function formatValidityDate(date) {
            if (!date) return '未知';
            return date.toISOString().split('T')[0] + ' ' + date.toTimeString().split(' ')[0];
        }


        // ==========================================
        // X.509 憑證詳細資訊解密與比對輔助函數
        // ==========================================
        function parseDistinguishedName(dnObj) {
            if (!dnObj || !dnObj.attributes) return '未知';
            const attributes = {};
            dnObj.attributes.forEach(attr => {
                if (attr.name || attr.type) {
                    const key = attr.name || attr.type;
                    attributes[key] = attr.value;
                }
            });
            return attributes.CN || attributes.commonName || '無通用名稱';
        }


        // ==========================================
        // 核心密碼學轉換：1. PFX / P12 轉 PEM
        // ==========================================
        function convertPfxToPem() {
            hideAlert();
            document.getElementById('result-section').style.display = 'none';

            if (!uploadedFiles.pfx) {
                showAlert('請先上傳 .pfx 或 .p12 檔案！');
                return;
            }

            const password = document.getElementById('pfx-password').value;
            const fileReader = new FileReader();

            fileReader.onload = function(e) {
                const binaryData = e.target.result;

                try {
                    const asn1 = forge.asn1.fromDer(binaryData);
                    const p12 = forge.pkcs12.pkcs12FromAsn1(asn1, password);

                    let privateKeyPemPkcs1 = '';
                    let privateKeyPemPkcs8 = '';
                    let privateKeyObj = null;
                    const pkcs8Bags = p12.getBags({ bagType: forge.pki.oids.pkcs8ShroudedKeyBag })[forge.pki.oids.pkcs8ShroudedKeyBag] || [];
                    const keyBags = p12.getBags({ bagType: forge.pki.oids.keyBag })[forge.pki.oids.keyBag] || [];
                    
                    if (pkcs8Bags.length > 0) {
                        privateKeyObj = pkcs8Bags[0].key;
                    } else if (keyBags.length > 0) {
                        privateKeyObj = keyBags[0].key;
                    }

                    if (privateKeyObj) {
                        privateKeyPemPkcs1 = forge.pki.privateKeyToPem(privateKeyObj).trim();
                        try {
                            const rsaPrivateKey = forge.pki.privateKeyToAsn1(privateKeyObj);
                            const privateKeyInfo = forge.pki.wrapRsaPrivateKey(rsaPrivateKey);
                            privateKeyPemPkcs8 = forge.pki.privateKeyInfoToPem(privateKeyInfo).trim();
                        } catch (p8Err) {
                            privateKeyPemPkcs8 = privateKeyPemPkcs1;
                        }
                    }

                    const certBags = p12.getBags({ bagType: forge.pki.oids.certBag })[forge.pki.oids.certBag] || [];
                    let certPem = '';
                    let caBundlePem = '';
                    let clientCertObj = null;
                    let subjectName = '未知';
                    let issuerName = '未知';
                    let notBeforeStr = '未知';
                    let notAfterStr = '未知';

                    if (certBags.length > 0) {
                        let mainCertBag = certBags[0];
                        let intermediateBags = [];

                        if (privateKeyObj) {
                            const keyModulus = privateKeyObj.n.toString(16);
                            let matchedIndex = -1;
                            
                            for (let i = 0; i < certBags.length; i++) {
                                const c = certBags[i].cert;
                                if (c.publicKey && c.publicKey.n && c.publicKey.n.toString(16) === keyModulus) {
                                    matchedIndex = i;
                                    break;
                                }
                            }
                            if (matchedIndex !== -1) {
                                mainCertBag = certBags[matchedIndex];
                                intermediateBags = certBags.filter((_, idx) => idx !== matchedIndex);
                            } else {
                                intermediateBags = certBags.slice(1);
                            }
                        } else {
                            intermediateBags = certBags.slice(1);
                        }

                        clientCertObj = mainCertBag.cert;
                        certPem = forge.pki.certificateToPem(clientCertObj).trim();
                        caBundlePem = intermediateBags.map(b => forge.pki.certificateToPem(b.cert).trim()).join('\n');
                        
                        subjectName = parseDistinguishedName(clientCertObj.subject);
                        issuerName = parseDistinguishedName(clientCertObj.issuer);
                        notBeforeStr = formatValidityDate(clientCertObj.validity.notBefore);
                        notAfterStr = formatValidityDate(clientCertObj.validity.notAfter);
                    }

                    const daysRemaining = checkCertificateExpiry(clientCertObj);

                    const outputs = [
                        { filename: 'certificate.crt', content: certPem, label: '憑證檔案 (.crt)' }
                    ];

                    if (privateKeyPemPkcs8 || privateKeyPemPkcs1) {
                        outputs.push({
                            filename: 'private.key',
                            content: privateKeyPemPkcs8 || privateKeyPemPkcs1,
                            contentPkcs8: privateKeyPemPkcs8,
                            contentPkcs1: privateKeyPemPkcs1,
                            label: '私鑰檔案 (.key)',
                            isPrivateKey: true
                        });
                    }

                    if (caBundlePem && caBundlePem.trim()) {
                        outputs.push({ filename: 'ca-bundle.crt', content: caBundlePem, label: '中繼憑證鏈 (.ca-bundle)' });
                        outputs.push({ 
                            filename: 'fullchain.crt', 
                            content: `${certPem.trim()}\n${caBundlePem.trim()}`, 
                            label: '完整憑證鏈 [包含伺服器憑證+中繼憑證] (.crt)' 
                        });
                    }

                    showConversionResults({
                        meta: [
                            { label: '檔案名稱', value: uploadedFiles.pfx.name },
                            { label: '通用名稱 (CN)', value: subjectName },
                            { label: '簽發機構 (Issuer)', value: issuerName },
                            { label: '生效時間 (Not Before)', value: notBeforeStr },
                            { 
                                label: '過期時間 (Not After)', 
                                value: notAfterStr, 
                                class: daysRemaining !== null && daysRemaining <= 30 ? (daysRemaining < 0 ? 'danger' : 'warning') : 'success' 
                            }
                        ],
                        outputs: outputs
                    });

                } catch (err) {
                    showAlert(`解密失敗：${err.message || '請確認密碼是否正確，且檔案格式未損壞！'}`);
                }
            };

            fileReader.readAsBinaryString(uploadedFiles.pfx);
        }


        // ==========================================
        // 核心密碼學轉換：2. PEM 轉 PFX / P12
        // ==========================================
        function convertPemToPfx() {
            hideAlert();
            document.getElementById('result-section').style.display = 'none';

            const keyPem = document.getElementById('pem-key').value.trim();
            const certPem = document.getElementById('pem-cert').value.trim();
            const caBundlePem = document.getElementById('pem-cabundle').value.trim();
            const password = document.getElementById('pem-password').value;
            const friendlyName = document.getElementById('pem-friendly-name').value.trim() || 'ssl-converter-certificate';

            if (!keyPem || !certPem) {
                showAlert('請先粘貼「私鑰 PEM」與「憑證 PEM」！');
                return;
            }

            if (!password) {
                showAlert('為保憑證安全，請設定 PFX 的加密保護密碼！');
                return;
            }

            try {
                const privateKeyObj = forge.pki.privateKeyFromPem(keyPem);
                const certObj = forge.pki.certificateFromPem(certPem);

                const keyModulus = privateKeyObj.n.toString(16);
                const certModulus = certObj.publicKey.n.toString(16);

                if (keyModulus !== certModulus) {
                    showAlert('安全攔截：您上傳的私鑰與憑證的模數 (Modulus) 不匹配，請重新確認兩者是否配對！', 'error');
                    return;
                }

                let intermediateCerts = [];
                if (caBundlePem) {
                    const certRegex = /-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----/g;
                    const matches = caBundlePem.match(certRegex) || [];
                    intermediateCerts = matches.map(pem => forge.pki.certificateFromPem(pem));
                }

                const pfxAsn1 = forge.pkcs12.toPkcs12Asn1(
                    privateKeyObj,
                    [certObj].concat(intermediateCerts),
                    password,
                    {
                        algorithm: '3des',
                        friendlyName: friendlyName,
                        generateLocalKeyId: true
                    }
                );

                const pfxDer = forge.asn1.toDer(pfxAsn1).getBytes();
                const buffer = new Uint8Array(pfxDer.length);
                for (let i = 0; i < pfxDer.length; i++) {
                    buffer[i] = pfxDer.charCodeAt(i) & 0xff;
                }

                const blob = new Blob([buffer], { type: 'application/x-pkcs12' });
                triggerDownload(blob, `${friendlyName}.pfx`);
                
                showAlert('PFX 打包成功並已觸發下載！', 'success');

            } catch (err) {
                showAlert(`打包失敗：${err.message || '請確認 PEM 格式是否正確完整！'}`);
            }
        }


        // ==========================================
        // 核心密碼學轉換：3. DER 轉 PEM
        // ==========================================
        function convertDerToPem() {
            hideAlert();
            document.getElementById('result-section').style.display = 'none';

            if (!uploadedFiles.der) {
                showAlert('請先上傳二進位的 DER / CER / CRT 憑證！');
                return;
            }

            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                const binaryData = e.target.result;

                try {
                    const asn1 = forge.asn1.fromDer(binaryData);
                    let pemResult = '';
                    let typeLabel = '';
                    let subjectName = '無';
                    let notAfterStr = '無';
                    let privateKeyPemPkcs1 = '';
                    let privateKeyPemPkcs8 = '';

                    try {
                        const cert = forge.pki.certificateFromAsn1(asn1);
                        pemResult = forge.pki.certificateToPem(cert);
                        typeLabel = 'X.509 憑證 (Certificate)';
                        subjectName = parseDistinguishedName(cert.subject);
                        notAfterStr = formatValidityDate(cert.validity.notAfter);
                        checkCertificateExpiry(cert);
                    } catch (certErr) {
                        try {
                            const key = forge.pki.privateKeyFromAsn1(asn1);
                            privateKeyPemPkcs1 = forge.pki.privateKeyToPem(key).trim();
                            try {
                                const rsaPrivateKey = forge.pki.privateKeyToAsn1(key);
                                const privateKeyInfo = forge.pki.wrapRsaPrivateKey(rsaPrivateKey);
                                privateKeyPemPkcs8 = forge.pki.privateKeyInfoToPem(privateKeyInfo).trim();
                            } catch (p8Err) {
                                privateKeyPemPkcs8 = privateKeyPemPkcs1;
                            }
                            pemResult = privateKeyPemPkcs8; // 預設 pemResult 為 PKCS#8 通用格式
                            typeLabel = 'RSA 私鑰 (Private Key)';
                        } catch (keyErr) {
                            const base64 = forge.util.encode64(binaryData);
                            const formatted = base64.match(/.{1,64}/g).join('\n');
                            pemResult = `-----BEGIN CERTIFICATE-----\n${formatted}\n-----END CERTIFICATE-----`;
                            typeLabel = '未分類 DER 二進位資料';
                        }
                    }

                    let outputs = [];
                    if (typeLabel === 'RSA 私鑰 (Private Key)') {
                        outputs.push({
                            filename: 'private.key',
                            content: privateKeyPemPkcs8 || privateKeyPemPkcs1,
                            contentPkcs8: privateKeyPemPkcs8,
                            contentPkcs1: privateKeyPemPkcs1,
                            label: '私鑰檔案 (.key)',
                            isPrivateKey: true
                        });
                    } else {
                        outputs.push({ filename: 'converted.pem', content: pemResult, label: '轉換後的 PEM 檔案 (.pem)' });
                    }

                    showConversionResults({
                        meta: [
                            { label: '原始檔名', value: uploadedFiles.der.name },
                            { label: '解析類型', value: typeLabel },
                            { label: '主體通用名稱', value: subjectName },
                            { label: '過期時間', value: notAfterStr }
                        ],
                        outputs: outputs
                    });

                } catch (err) {
                    showAlert(`DER 轉換失敗：${err.message || '請確認檔案是否為合法的二進位 ASN.1/DER 編碼！'}`);
                }
            };

            fileReader.readAsBinaryString(uploadedFiles.der);
        }


        // ==========================================
        // 核心密碼學轉換：4. PEM 轉 DER
        // ==========================================
        function convertPemToDer() {
            hideAlert();
            document.getElementById('result-section').style.display = 'none';

            const pemText = document.getElementById('pem-der-input').value.trim();
            if (!pemText) {
                showAlert('請先粘貼 PEM 文字憑證或私鑰內容！');
                return;
            }

            try {
                let derBytes = '';
                let filename = '';
                let mimeType = '';

                if (pemText.includes('CERTIFICATE')) {
                    const cert = forge.pki.certificateFromPem(pemText);
                    const asn1 = forge.pki.certificateToAsn1(cert);
                    derBytes = forge.asn1.toDer(asn1).getBytes();
                    filename = 'certificate.der';
                    mimeType = 'application/x-x509-ca-cert';
                } else if (pemText.includes('PRIVATE KEY')) {
                    const key = forge.pki.privateKeyFromPem(pemText);
                    const asn1 = forge.pki.privateKeyToAsn1(key);
                    derBytes = forge.asn1.toDer(asn1).getBytes();
                    filename = 'private.key.der';
                    mimeType = 'application/octet-stream';
                } else {
                    throw new Error('未偵測到 BEGIN CERTIFICATE 或 BEGIN PRIVATE KEY 頭尾標籤！');
                }

                const buffer = new Uint8Array(derBytes.length);
                for (let i = 0; i < derBytes.length; i++) {
                    buffer[i] = derBytes.charCodeAt(i) & 0xff;
                }

                const blob = new Blob([buffer], { type: mimeType });
                triggerDownload(blob, filename);

                showAlert('DER 二進位憑證包打包成功並已開始下載！', 'success');

            } catch (err) {
                showAlert(`轉換失敗：${err.message || '請確認輸入的是否為合法的 PEM 格式內容。'}`);
            }
        }


        // ==========================================
        // 通用渲染與下載觸發
        // ==========================================
        function showConversionResults(resultData) {
            lastResultData = resultData;
            
            // 初始化 AIA 鏈
            currentChainPems = [];
            
            let mainCertPem = '';
            const certOutput = resultData.outputs.find(o => o.filename === 'certificate.crt');
            if (certOutput && certOutput.content) {
                mainCertPem = certOutput.content;
            } else {
                const derOutput = resultData.outputs.find(o => o.filename === 'converted.pem');
                const isCertType = resultData.meta && resultData.meta.some(m => m.label === '解析類型' && m.value.includes('X.509 憑證'));
                if (derOutput && isCertType && derOutput.content) {
                    mainCertPem = derOutput.content;
                }
            }
            
            // 如果轉換結果中本來就包含中繼憑證 (ca-bundle.crt) 或完整憑證鏈 (fullchain.crt)
            // 代表憑證鏈已經完整，直接提供即可，不需要跳出補鏈提示
            const hasExistingChain = resultData.outputs.some(o => 
                (o.filename === 'ca-bundle.crt' || o.filename === 'fullchain.crt') && 
                o.content && o.content.trim() !== ''
            );
            
            if (mainCertPem && !hasExistingChain) {
                currentChainPems.push(mainCertPem.trim());
            }

            const metaContainer = document.getElementById('result-meta');
            const outputsContainer = document.getElementById('result-outputs');
            
            metaContainer.innerHTML = resultData.meta.map(item => `
                <div class="meta-item">
                    <span class="meta-label">${item.label}</span>
                    <span class="meta-value ${item.class || ''}">${item.value}</span>
                </div>
            `).join('');

            // 委託給專用的 outputs 渲染函式以避免程式碼重複，並支持私鑰格式動態切換
            renderOutputsOnly(resultData.outputs);

            document.getElementById('result-section').style.display = 'flex';
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });

            // 執行 AIA 補齊檢查
            checkAndShowAiaFixCard();
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyToClipboard(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            
            const btn = document.querySelector(`[onclick="copyToClipboard('${elementId}')"]`);
            const oldHtml = btn.innerHTML;
            btn.innerHTML = '已複製！';
            setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
        }

        function downloadTextFile(filename, elementId) {
            const content = document.getElementById(elementId).value;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            triggerDownload(blob, filename);
        }

        // ==========================================
        // AIA 憑證鏈自動補齊功能
        // ==========================================
        function getDnString(dnObj) {
            if (!dnObj || !dnObj.attributes) return '';
            return dnObj.attributes.map(attr => `${attr.type}=${attr.value}`).sort().join(',');
        }

        function isRootCertificate(certObj) {
            if (!certObj) return false;
            const issuerStr = getDnString(certObj.issuer);
            const subjectStr = getDnString(certObj.subject);
            return issuerStr !== '' && issuerStr === subjectStr;
        }

        function extractAiaUrl(certObj) {
            const ext = certObj.getExtension('authorityInfoAccess');
            if (!ext) return null;
            
            let derStr = '';
            if (ext.value) {
                derStr = ext.value;
            } else if (ext.asn1Value) {
                derStr = forge.asn1.toDer(ext.asn1Value).getBytes();
            } else {
                return null;
            }
            
            const aiaRegex = /http:\/\/[A-Za-z0-9\-\.\/]+\.(cer|crt|p7b)/i;
            const match = derStr.match(aiaRegex);
            return match ? match[0] : null;
        }

        function checkAndShowAiaFixCard() {
            const container = document.getElementById('aia-fix-container');
            if (!container) return;
            
            if (currentChainPems.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            const lastPem = currentChainPems[currentChainPems.length - 1];
            
            try {
                const certObj = forge.pki.certificateFromPem(lastPem);
                
                if (isRootCertificate(certObj)) {
                    container.style.display = 'none';
                    finalizeChain();
                    return;
                }
                
                const aiaUrl = extractAiaUrl(certObj);
                if (!aiaUrl) {
                    container.style.display = 'none';
                    finalizeChain();
                    return;
                }
                
                // 將 http:// 自動升級為 https:// 以避開瀏覽器安全下載攔截機制，絕大多數 CA 都支援 https
                const secureAiaUrl = aiaUrl.startsWith('http://') ? aiaUrl.replace('http://', 'https://') : aiaUrl;
                
                const isFirstLayer = currentChainPems.length === 1;
                const tipText = isFirstLayer 
                    ? '⚠️ 偵測到憑證鏈不完整，建議補齊'
                    : `👍 成功解析第 ${currentChainPems.length - 1} 層！偵測到還有上一層中繼憑證，請繼續下載並上傳`;
                    
                container.innerHTML = `
                    <div class="output-card" style="border: 1px solid var(--warning-color); padding: 1.5rem; border-radius: 12px; background: rgba(255, 170, 0, 0.03); display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;">
                        <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--warning-color); font-weight: 600; font-size: 0.95rem;">
                            <span>${tipText}</span>
                        </div>
                        <div style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5;">
                            請點擊下方連結下載官方中繼憑證，並將下載的檔案拖曳至下方上傳區：
                            <div style="margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.25rem;">
                                <a id="aia-download-link" href="${secureAiaUrl}" target="_blank" style="color: var(--accent-glow); text-decoration: underline; font-weight: 500; word-break: break-all;">
                                    ${secureAiaUrl}
                                </a>
                                <span style="font-size: 0.75rem; color: var(--text-secondary); opacity: 0.8; margin-top: 0.2rem;">
                                    💡 貼心提醒：若點擊無法下載，請<strong>右鍵點擊連結選擇「另存連結為...」</strong>，或複製網址至新分頁貼上開啟。
                                </span>
                            </div>
                        </div>
                        <div class="upload-zone" id="aia-upload-zone" style="padding: 1.5rem 1rem;">
                            <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; fill: var(--text-secondary);"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">將下載的憑證檔案拖曳至此，或點擊選擇檔案</p>
                            <input type="file" class="file-input" id="aia-file-input" accept=".cer,.crt,.der">
                        </div>
                    </div>
                `;
                container.style.display = 'block';
                
                setupAiaUploadEvents();
                
            } catch (err) {
                container.style.display = 'none';
            }
        }

        function setupAiaUploadEvents() {
            const zone = document.getElementById('aia-upload-zone');
            const input = document.getElementById('aia-file-input');
            if (!zone || !input) return;
            
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleAiaFile(e.dataTransfer.files[0]);
                }
            });

            input.addEventListener('change', (e) => {
                if (input.files.length > 0) {
                    handleAiaFile(input.files[0]);
                }
            });
        }

        function handleAiaFile(file) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                const binaryData = e.target.result;
                try {
                    let certObj = null;
                    let pem = '';
                    
                    try {
                        const asn1 = forge.asn1.fromDer(binaryData);
                        certObj = forge.pki.certificateFromAsn1(asn1);
                        pem = forge.pki.certificateToPem(certObj);
                    } catch (derErr) {
                        try {
                            const text = forge.util.binaryStringToString(binaryData);
                            certObj = forge.pki.certificateFromPem(text);
                            pem = forge.pki.certificateToPem(certObj);
                        } catch (pemErr) {
                            try {
                                certObj = forge.pki.certificateFromPem(binaryData);
                                pem = forge.pki.certificateToPem(certObj);
                            } catch (err) {
                                throw new Error('解析失敗');
                            }
                        }
                    }
                    
                    if (!certObj || !pem) {
                        throw new Error('解析失敗');
                    }
                    
                    currentChainPems.push(pem.trim());
                    checkAndShowAiaFixCard();
                    
                } catch (err) {
                    showAlert('解析失敗，請確認上傳的是剛剛下載的憑證檔案', 'error');
                }
            };
            fileReader.readAsBinaryString(file);
        }

        function finalizeChain() {
            if (currentChainPems.length <= 1) return;
            
            const fullChainPem = currentChainPems.join('\n');
            
            if (lastResultData && lastResultData.outputs) {
                const existingIdx = lastResultData.outputs.findIndex(o => o.filename === 'fullchain.crt');
                const fullchainOutput = {
                    filename: 'fullchain.crt',
                    content: fullChainPem,
                    label: '完整憑證鏈 [包含伺服器憑證+中繼憑證] (.crt)'
                };
                
                if (existingIdx !== -1) {
                    lastResultData.outputs[existingIdx] = fullchainOutput;
                } else {
                    lastResultData.outputs.push(fullchainOutput);
                }
                
                renderOutputsOnly(lastResultData.outputs);
                showAlert('成功補齊中繼憑證，已更新/產生完整憑證鏈 (fullchain.crt)！', 'success');
            }
        }

        function togglePrivateKeyFormat(selectElem, textareaId, idx) {
            const format = selectElem.value;
            const textarea = document.getElementById(textareaId);
            const outputItem = lastResultData.outputs[idx];
            
            if (format === 'pkcs8') {
                textarea.value = outputItem.contentPkcs8;
                updateDownloadButton(textareaId, 'private.key');
            } else {
                textarea.value = outputItem.contentPkcs1;
                updateDownloadButton(textareaId, 'private.rsa.key');
            }
        }

        function updateDownloadButton(textareaId, filename) {
            const textarea = document.getElementById(textareaId);
            const card = textarea.closest('.output-card');
            const downloadBtn = card.querySelector('[onclick^="downloadTextFile"]');
            if (downloadBtn) {
                downloadBtn.setAttribute('onclick', `downloadTextFile('${filename}', '${textareaId}')`);
            }
        }

        function renderOutputsOnly(outputs) {
            const outputsContainer = document.getElementById('result-outputs');
            outputsContainer.innerHTML = outputs.map((item, idx) => {
                const uniqueId = `output-val-${idx}`;
                const isEmpty = !item.content || item.content.trim() === '';
                const styleDisplay = isEmpty ? 'display:none;' : '';
                
                // 私鑰切換格式下拉選單 (遵守暗色系規範)
                const formatSelectHtml = item.isPrivateKey ? `
                    <select class="btn-mini" onchange="togglePrivateKeyFormat(this, '${uniqueId}', ${idx})" style="background-color: #121218 !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.75rem; outline: none; cursor: pointer;">
                        <option value="pkcs8" style="background-color: #121218 !important; color: #ffffff !important;">PKCS#8 (通用)</option>
                        <option value="pkcs1" style="background-color: #121218 !important; color: #ffffff !important;">PKCS#1 (傳統 RSA)</option>
                    </select>
                ` : '';

                return `
                    <div class="output-card" style="${styleDisplay}">
                        <div class="output-header">
                            <span class="output-name">${item.label || item.filename}</span>
                            <div class="output-actions">
                                ${formatSelectHtml}
                                <button class="btn-mini" onclick="copyToClipboard('${uniqueId}')">
                                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                                    複製
                                </button>
                                <button class="btn-mini" onclick="downloadTextFile('${item.filename}', '${uniqueId}')">
                                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                    下載
                                </button>
                            </div>
                        </div>
                        <textarea class="custom-textarea" id="${uniqueId}" style="height: 120px;" readonly>${item.content || ''}</textarea>
                    </div>
                `;
            }).join('');
        }
    </script>
    <script src="../js/common-particles.js" defer></script>
</body>
</html>
